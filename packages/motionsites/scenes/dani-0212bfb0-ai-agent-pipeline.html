<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agent Pipeline</title>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var l = p.get('lang') === 'fa' ? 'fa' : 'en';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --card: #0a0a0b;
    --card-2: #0d0d0f;
    --node: #18181b;
    --node-hi: #1f1f23;
    --border: rgba(255,255,255,.08);
    --ink: #e4e4e7;
    --muted: #71717a;
    --faint: #3f3f46;
    --accent: #2f5cff;
    --accent-soft: rgba(47,92,255,.18);
    --ok: #22c55e;
    --warn: #b45309;
    --hot: #f59e0b;
    --err: #ef4444;
    --step-ms: 1700;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  html[lang="fa"] {
    --sans: 'Vazirmatn', 'Inter', system-ui, sans-serif;
    --mono-fa: 'Vazirmatn', 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 1.5px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 72px 16px 56px; gap: 22px;
  }
  .stage-glow {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(40% 35% at 50% 50%, rgba(47,92,255,.06), transparent 70%);
  }

  /* ---------- card ---------- */
  .card {
    position: relative; width: min(100%, 556px);
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03);
    opacity: 0; transform: translateY(10px);
    animation: rise .7s cubic-bezier(.2,.7,.2,1) .1s forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 16px; border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  html[lang="fa"] .head { font-family: var(--sans); letter-spacing: 0; font-size: 11px; }
  .live { display: inline-flex; align-items: center; gap: 8px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 0 rgba(34,197,94,.5); animation: ping 2s infinite;
  }
  .live.paused .dot { background: var(--muted); animation: none; }
  @keyframes ping { 70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .head .sum { color: var(--faint); letter-spacing: .04em; text-transform: none; }
  .head .sum b { font-weight: 400; color: var(--faint); }
  .head .sum.bad b.e { color: var(--err); }

  /* ---------- flow ---------- */
  .flow {
    position: relative; display: grid; align-items: center;
    grid-template-columns: auto 1fr auto 1fr auto 34px auto;
    padding: 32px 15px 34px; min-height: 165px;
  }
  .wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .wires path { fill: none; stroke: var(--accent); stroke-opacity: .35; stroke-width: 1.2; stroke-dasharray: 2 5; }
  .wires path.on { stroke-opacity: .9; animation: dash .6s linear infinite; }
  .wires path.fail { stroke: var(--err); stroke-opacity: .8; }
  @keyframes dash { to { stroke-dashoffset: -7; } }
  .wires circle { fill: var(--accent); }
  .wires circle.end { fill: var(--accent); opacity: .85; }
  .wires .pulse { fill: #7b98ff; filter: drop-shadow(0 0 4px #2f5cff); }

  .node {
    position: relative; z-index: 1; text-align: center;
    background: var(--node); border: 1px solid transparent; border-radius: 7px;
    padding: 7px 14px 8px; min-width: 96px;
    transition: border-color .35s, background .35s, box-shadow .35s, transform .2s;
  }
  .node:hover { background: var(--node-hi); }
  .node .k {
    display: block; font-family: var(--mono); font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase;
    color: #52525b; margin-bottom: 3px;
  }
  html[lang="fa"] .node .k { font-family: var(--sans); letter-spacing: 0; font-size: 10px; }
  .node .t { display: block; font-size: 12px; color: var(--ink); white-space: nowrap; }
  .node .sub {
    position: absolute; inset-inline: 0; top: calc(100% + 7px); font-family: var(--mono);
    font-size: 8.5px; color: #3a3a40; letter-spacing: .04em; direction: ltr;
  }
  .node.active { border-color: rgba(47,92,255,.55); box-shadow: 0 0 0 3px rgba(47,92,255,.08); }
  .node.done .k { color: #6b7280; }

  .node.llm {
    border-color: var(--accent); background: #0b1020; padding: 12px 16px 10px; min-width: 100px;
    box-shadow: 0 0 0 1px rgba(47,92,255,.25), 0 0 28px -6px rgba(47,92,255,.55);
  }
  .node.llm .k { color: #2f5cff; }
  .node.llm .t { font-size: 12.5px; font-weight: 500; color: #fff; }
  .node.llm .sub { color: #1f3a9c; }
  .think { display: flex; justify-content: center; gap: 6px; margin-top: 8px; height: 5px; }
  .think i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .25; }
  .node.llm.active .think i { animation: blink 1.1s infinite; }
  .node.llm.active .think i:nth-child(2) { animation-delay: .18s; }
  .node.llm.active .think i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 100% { opacity: .25; transform: scale(.85); } 40% { opacity: 1; transform: scale(1); } }
  .node.llm:not(.active) .think i { opacity: .6; }

  .tools { grid-column: 7; display: flex; flex-direction: column; gap: 8px; z-index: 1; }
  .tool {
    position: relative; display: flex; align-items: center; justify-content: space-between; gap: 18px;
    background: var(--node); border: 1px solid transparent; border-radius: 6px;
    padding: 8px 12px 8px 13px; min-width: 112px; font-size: 11.5px; color: #d4d4d8; text-align: start;
    transition: border-color .35s, background .35s;
  }
  .tool:hover { background: var(--node-hi); }
  .tool .s { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); align-self: flex-start; margin-top: 1px; transition: background .3s, box-shadow .3s; }
  .tool.run { border-color: rgba(47,92,255,.4); }
  .tool.run .s { background: var(--hot); box-shadow: 0 0 6px var(--hot); animation: blink 1s infinite; }
  .tool.ok .s { background: var(--ok); box-shadow: 0 0 6px rgba(34,197,94,.6); }
  .tool.queued .s { background: var(--warn); }
  .tool.fail { border-color: rgba(239,68,68,.45); }
  .tool.fail .s { background: var(--err); box-shadow: 0 0 6px var(--err); }

  .c1 { grid-column: 1; } .c3 { grid-column: 3; } .c5 { grid-column: 5; }

  /* tooltip */
  .tip {
    position: absolute; z-index: 5; bottom: calc(100% + 10px); inset-inline-start: 50%;
    transform: translate(-50%, 4px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    background: #1c1c20; border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
    padding: 7px 11px; font-size: 11px; color: #d4d4d8; font-family: var(--sans);
    box-shadow: 0 12px 30px -10px rgba(0,0,0,.8);
    transition: opacity .18s, transform .18s;
  }
  html[dir="rtl"] .tip { transform: translate(50%, 4px); }
  .tip svg { width: 13px; height: 13px; flex: none; color: #a1a1aa; }
  .node:hover .tip, .node:focus-visible .tip, .tool:hover .tip, .tool:focus-visible .tip { opacity: 1; transform: translate(-50%, 0); }
  html[dir="rtl"] .node:hover .tip, html[dir="rtl"] .node:focus-visible .tip,
  html[dir="rtl"] .tool:hover .tip, html[dir="rtl"] .tool:focus-visible .tip { transform: translate(50%, 0); }
  .tool .tip { inset-inline-start: auto; inset-inline-end: 0; transform: translateY(4px); }
  .tool:hover .tip, .tool:focus-visible .tip, html[dir="rtl"] .tool:hover .tip, html[dir="rtl"] .tool:focus-visible .tip { transform: none; }
  html[dir="rtl"] .tool .tip { transform: translateY(4px); }

  /* ---------- log ---------- */
  .log {
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 14px 16px; min-height: 46px; display: flex; gap: 9px; align-items: baseline;
    font-family: var(--mono); font-size: 10.5px; color: #a1a1aa; overflow: hidden;
  }
  html[lang="fa"] .log { font-family: var(--sans); font-size: 12px; }
  .log .pr { color: var(--accent); flex: none; }
  html[dir="rtl"] .log .pr { transform: scaleX(-1); display: inline-block; }
  .log .line { display: inline-block; min-width: 0; overflow-wrap: anywhere; }
  .log .line.in { animation: typeIn .3s ease both; }
  .log .line.err { color: #fca5a5; }
  .log code { font-family: var(--mono); font-size: 10.5px; color: #c7d2fe; }
  @keyframes typeIn { from { opacity: .3; transform: translateY(4px); filter: blur(1.5px); } to { opacity: 1; transform: none; filter: none; } }
  .caret { display: inline-block; width: 6px; height: 11px; background: #52525b; vertical-align: -1px; margin-inline-start: 3px; animation: caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }

  /* ---------- footer ---------- */
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 13px 16px 11px; }
  .stats { display: flex; gap: 22px; }
  .stat .l, .stack .l {
    display: block; font-family: var(--mono); font-size: 8px; letter-spacing: .12em; text-transform: uppercase; color: #3f3f46; margin-bottom: 4px;
  }
  html[lang="fa"] .stat .l, html[lang="fa"] .stack .l { font-family: var(--sans); letter-spacing: 0; font-size: 10px; }
  .stat .v { font-family: var(--mono); font-size: 14px; color: #d4d4d8; font-variant-numeric: tabular-nums; }
  html[lang="fa"] .stat .v { font-family: var(--sans); font-size: 15px; }
  .stat .v.bump { animation: bump .5s ease; }
  @keyframes bump { 40% { color: #fff; text-shadow: 0 0 10px rgba(47,92,255,.8); } }
  .stack { text-align: end; }
  .stack .v { font-family: var(--mono); font-size: 9.5px; color: #2343b8; direction: ltr; }
  .stack .v span { color: #27272a; }

  /* ---------- controls ---------- */
  .controls {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    opacity: 0; animation: rise .6s ease .45s forwards;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    background: #0e0e10; border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 13px; font-size: 12px; color: #a1a1aa; transition: color .2s, border-color .2s, background .2s;
  }
  .btn:hover { color: #fff; border-color: rgba(255,255,255,.18); }
  .btn svg { width: 13px; height: 13px; }
  .btn[aria-pressed="true"] { color: #fff; border-color: rgba(47,92,255,.6); background: rgba(47,92,255,.1); }
  .btn.danger:hover { border-color: rgba(239,68,68,.5); color: #fecaca; }
  .hint { font-size: 11.5px; color: #52525b; text-align: center; max-width: 440px; line-height: 1.7; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- narrow: vertical pipeline ---------- */
  @media (max-width: 600px) {
    main { padding-top: 40px; }
    .flow {
      grid-template-columns: 1fr; grid-template-rows: auto; row-gap: 34px; justify-items: center;
      padding: 28px 14px 30px;
    }
    .c1, .c3, .c5, .tools { grid-column: 1; }
    .node { min-width: 170px; }
    .node .sub { position: static; display: block; margin-top: 3px; }
    .tools { flex-direction: row; gap: 6px; width: 100%; justify-content: center; margin-top: 6px; }
    .tool { min-width: 0; flex: 1 1 0; padding: 8px 9px; gap: 6px; font-size: 11px; }
    .tool .tip { display: none; }
    .stats { gap: 16px; }
    .foot { flex-wrap: wrap; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card, .controls { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div class="stage-glow" aria-hidden="true"></div>
<main>
  <section class="card" aria-labelledby="pl-title">
    <header class="head">
      <span class="live" id="live"><span class="dot" aria-hidden="true"></span><span id="pl-title" data-i18n="title">Agent pipeline · Live</span></span>
      <span class="sum" id="sum"><b class="a" data-i18n="agents">3 agents</b> · <b class="e" id="errs">0 errors</b></span>
    </header>

    <div class="flow" id="flow">
      <svg class="wires" id="wires" aria-hidden="true"></svg>

      <button class="node c1" data-step="0" type="button">
        <span class="tip" role="tooltip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg><span data-i18n="tip0">Webhook · 18 req/min</span></span>
        <span class="k" data-i18n="n0k">Trigger</span>
        <span class="t" data-i18n="n0t">User Query</span>
        <span class="sub">node-01</span>
      </button>

      <button class="node c3" data-step="1" type="button">
        <span class="tip" role="tooltip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></svg><span data-i18n="tip1">Index: 48k vectors · 1536 dims</span></span>
        <span class="k" data-i18n="n1k">Vector DB</span>
        <span class="t" data-i18n="n1t">Semantic Search</span>
        <span class="sub">pinecone</span>
      </button>

      <button class="node llm c5" data-step="2" type="button">
        <span class="tip" role="tooltip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg><span data-i18n="tip2">Memory usage: 633 MB</span></span>
        <span class="k" data-i18n="n2k">LLM Agent</span>
        <span class="t" data-i18n="n2t">Processing</span>
        <span class="think" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="sub">claude-3-sonnet</span>
      </button>

      <div class="tools" role="group" aria-label="Tool calls" data-i18n-aria="toolsAria">
        <button class="tool" data-tool="0" type="button"><span data-i18n="t0">Email Draft</span><span class="s" aria-hidden="true"></span>
          <span class="tip" role="tooltip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg><span data-i18n="tip3">send_email · 312 words</span></span></button>
        <button class="tool" data-tool="1" type="button"><span data-i18n="t1">CRM Update</span><span class="s" aria-hidden="true"></span>
          <span class="tip" role="tooltip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg><span data-i18n="tip4">crm_update · 4 records</span></span></button>
        <button class="tool" data-tool="2" type="button"><span data-i18n="t2">Report Gen</span><span class="s" aria-hidden="true"></span>
          <span class="tip" role="tooltip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span data-i18n="tip5">generate_report · PDF</span></span></button>
      </div>
    </div>

    <div class="log" aria-live="polite"><span class="pr" aria-hidden="true">&gt;</span><span class="line" id="log"></span></div>

    <footer class="foot">
      <div class="stats">
        <div class="stat"><span class="l" data-i18n="s0">Workflows</span><span class="v" id="wf">1,397</span></div>
        <div class="stat"><span class="l" data-i18n="s1">Tokens</span><span class="v" id="tk">4.2M</span></div>
        <div class="stat"><span class="l" data-i18n="s2">Avg latency</span><span class="v" id="lat">342ms</span></div>
      </div>
      <div class="stack"><span class="l" data-i18n="s3">Stack</span><span class="v">Claude <span>·</span> Pinecone</span></div>
    </footer>
  </section>

  <div class="controls" role="toolbar" aria-label="Pipeline controls" data-i18n-aria="ctrlAria">
    <button class="btn" id="play" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" id="playIco"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <span id="playTxt" data-i18n="pause">Pause</span>
    </button>
    <button class="btn" id="step" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 4 10 8-10 8z"/><path d="M19 5v14"/></svg>
      <span data-i18n="step">Step</span>
    </button>
    <button class="btn" id="speed" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 19 9-7-9-7v14zM2 19l9-7-9-7v14z"/></svg>
      <span id="speedTxt">1×</span>
    </button>
    <button class="btn danger" id="fail" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
      <span data-i18n="fail">Simulate tool failure</span>
    </button>
  </div>
  <p class="hint" data-i18n="hint">Hover a node for live metrics · click any node to jump the run to that stage.</p>
</main>

<script>
(function () {
  'use strict';
  var lang = document.documentElement.lang === 'fa' ? 'fa' : 'en';
  var STEP_MS = 1700;           // ms per pipeline stage at 1x
  var BASE_WORKFLOWS = 1397;    // starting counter
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var I18N = {
    en: {
      title: 'Agent pipeline · Live', paused: 'Agent pipeline · Paused', agents: '3 agents',
      errs: function (n) { return n + (n === 1 ? ' error' : ' errors'); },
      n0k: 'Trigger', n0t: 'User Query', n1k: 'Vector DB', n1t: 'Semantic Search', n2k: 'LLM Agent', n2t: 'Processing',
      t0: 'Email Draft', t1: 'CRM Update', t2: 'Report Gen',
      tip0: 'Webhook · 18 req/min', tip1: 'Index: 48k vectors · 1536 dims', tip2: 'Memory usage: 633 MB',
      tip3: 'send_email · 312 words', tip4: 'crm_update · 4 records', tip5: 'generate_report · PDF',
      s0: 'Workflows', s1: 'Tokens', s2: 'Avg latency', s3: 'Stack',
      pause: 'Pause', play: 'Resume', step: 'Step', fail: 'Simulate tool failure',
      toolsAria: 'Tool calls', ctrlAria: 'Pipeline controls',
      hint: 'Hover a node for live metrics · click any node to jump the run to that stage.',
      logs: [
        'Trigger: incoming query “Summarize Q3 deals and notify the team”',
        'Vector search: 12 chunks retrieved from <code>pinecone</code> (top score 0.91)',
        'LLM inference: 3 tool calls dispatched in parallel',
        'Tool: <code>send_email</code> → draft created, 312 words, pending approval',
        'Tool: <code>crm_update</code> → 4 records synced',
        'Tool: <code>generate_report</code> → q3_summary.pdf rendered in 2.1s',
        'Workflow complete · 3/3 tools succeeded'
      ],
      failLog: 'Tool: <code>crm_update</code> → timeout after 5000ms, retrying (1/3)',
      recoverLog: 'Tool: <code>crm_update</code> → retry succeeded, 4 records synced'
    },
    fa: {
      title: 'خط لولهٔ ایجنت · زنده', paused: 'خط لولهٔ ایجنت · متوقف', agents: '۳ ایجنت',
      errs: function (n) { return fa(n) + ' خطا'; },
      n0k: 'تریگر', n0t: 'پرسش کاربر', n1k: 'پایگاه برداری', n1t: 'جست‌وجوی معنایی', n2k: 'ایجنت LLM', n2t: 'در حال پردازش',
      t0: 'پیش‌نویس ایمیل', t1: 'به‌روزرسانی CRM', t2: 'ساخت گزارش',
      tip0: 'وب‌هوک · ۱۸ درخواست در دقیقه', tip1: 'نمایه: ۴۸ هزار بردار · ۱۵۳۶ بُعد', tip2: 'مصرف حافظه: ۶۳۳ مگابایت',
      tip3: 'send_email · ۳۱۲ واژه', tip4: 'crm_update · ۴ رکورد', tip5: 'generate_report · PDF',
      s0: 'گردش‌کارها', s1: 'توکن‌ها', s2: 'میانگین تأخیر', s3: 'پشته',
      pause: 'توقف', play: 'ادامه', step: 'گام بعد', fail: 'شبیه‌سازی خطای ابزار',
      toolsAria: 'فراخوانی ابزارها', ctrlAria: 'کنترل‌های خط لوله',
      hint: 'برای دیدن آمار زنده، نشانگر را روی هر گره ببرید · با کلیک روی هر گره، اجرا به همان مرحله می‌پرد.',
      logs: [
        'تریگر: پرسش تازه رسید «معامله‌های فصل سوم را خلاصه کن و به تیم خبر بده»',
        'جست‌وجوی برداری: ۱۲ تکه از <code>pinecone</code> بازیابی شد (بالاترین امتیاز ۰٫۹۱)',
        'استنتاج LLM: سه فراخوانی ابزار هم‌زمان فرستاده شد',
        'ابزار: <code>send_email</code> ← پیش‌نویس ساخته شد، ۳۱۲ واژه، در انتظار تأیید',
        'ابزار: <code>crm_update</code> ← ۴ رکورد همگام شد',
        'ابزار: <code>generate_report</code> ← فایل q3_summary.pdf در ۲٫۱ ثانیه ساخته شد',
        'گردش‌کار تمام شد · هر سه ابزار موفق بودند'
      ],
      failLog: 'ابزار: <code>crm_update</code> ← پس از ۵۰۰۰ میلی‌ثانیه پاسخی نیامد، تلاش دوباره (۱ از ۳)',
      recoverLog: 'ابزار: <code>crm_update</code> ← تلاش دوباره موفق بود، ۴ رکورد همگام شد'
    }
  };
  function fa(x) { return String(x).replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }); }
  var T = I18N[lang];

  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var v = T[el.getAttribute('data-i18n')];
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-aria]').forEach(function (el) {
    var v = T[el.getAttribute('data-i18n-aria')];
    if (v) el.setAttribute('aria-label', v);
  });
  document.title = lang === 'fa' ? 'خط لولهٔ ایجنت هوش مصنوعی' : 'AI Agent Pipeline';

  var $ = function (s) { return document.querySelector(s); };
  var flow = $('#flow'), svg = $('#wires'), logEl = $('#log');
  var nodes = [].slice.call(document.querySelectorAll('.node'));
  var tools = [].slice.call(document.querySelectorAll('.tool'));
  if (!flow || !svg || !logEl) return;

  /* ---- numbers ---- */
  var wf = BASE_WORKFLOWS, tokens = 4.2, latency = 342, errors = 0;
  function fmtInt(n) { return lang === 'fa' ? n.toLocaleString('fa-IR') : n.toLocaleString('en-US'); }
  function fmtTok(n) { var s = n.toFixed(1); return lang === 'fa' ? fa(s).replace('.', '٫') + 'M' : s + 'M'; }
  function fmtLat(n) { return lang === 'fa' ? fa(n) + 'ms' : n + 'ms'; }
  function bump(el) { if (!el || reduce) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  function renderStats(b) {
    var a = $('#wf'), t = $('#tk'), l = $('#lat');
    if (a) a.textContent = fmtInt(wf);
    if (t) t.textContent = fmtTok(tokens);
    if (l) l.textContent = fmtLat(latency);
    if (b) { bump(a); bump(t); }
    var e = $('#errs'); if (e) e.textContent = T.errs(errors);
    var s = $('#sum'); if (s) s.classList.toggle('bad', errors > 0);
  }

  /* ---- wires (computed from layout, so RTL + mobile just work) ---- */
  var NS = 'http://www.w3.org/2000/svg';
  var wires = [];   // {path, from, to}
  var narrow = window.matchMedia('(max-width: 600px)');
  function center(r, base) { return { x: r.left - base.left + r.width / 2, y: r.top - base.top + r.height / 2 }; }
  function buildWires() {
    var base = flow.getBoundingClientRect();
    svg.setAttribute('viewBox', '0 0 ' + base.width + ' ' + base.height);
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    wires = [];
    var pairs = [[nodes[0], nodes[1], 1], [nodes[1], nodes[2], 2]];
    tools.forEach(function (t, i) { pairs.push([nodes[2], t, 3 + i]); });
    pairs.forEach(function (p) {
      var a = p[0].getBoundingClientRect(), b = p[1].getBoundingClientRect();
      var ca = center(a, base), cb = center(b, base);
      var horiz = !narrow.matches;
      var x1, y1, x2, y2, d;
      if (horiz) {
        var dir = cb.x > ca.x ? 1 : -1;
        x1 = dir > 0 ? a.right - base.left : a.left - base.left; y1 = ca.y;
        x2 = dir > 0 ? b.left - base.left : b.right - base.left; y2 = cb.y;
        var mx = (x1 + x2) / 2;
        d = 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
      } else {
        x1 = ca.x; y1 = a.bottom - base.top; x2 = cb.x; y2 = b.top - base.top;
        var my = (y1 + y2) / 2;
        d = 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + y2;
      }
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('d', d);
      svg.appendChild(path);
      [[x1, y1], [x2, y2]].forEach(function (pt) {
        var c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', pt[0]); c.setAttribute('cy', pt[1]); c.setAttribute('r', 2.2); c.setAttribute('class', 'end');
        svg.appendChild(c);
      });
      var pulse = document.createElementNS(NS, 'circle');
      pulse.setAttribute('r', 2.6); pulse.setAttribute('class', 'pulse'); pulse.style.opacity = 0;
      svg.appendChild(pulse);
      wires.push({ path: path, pulse: pulse, stage: p[2], len: path.getTotalLength(), tool: p[2] >= 3 ? p[2] - 3 : -1 });
    });
    paint();
  }

  /* ---- pipeline state machine ----
     stage 0 trigger · 1 vector · 2 llm · 3 email · 4 crm · 5 report · 6 complete */
  var stage = 0, playing = !reduce, speed = 1, failArmed = false, failing = false, timer = null, stageStart = performance.now();

  function setLog(html, cls) {
    logEl.className = 'line' + (cls ? ' ' + cls : '');
    logEl.innerHTML = html + '<span class="caret" aria-hidden="true"></span>';
    if (!reduce) { void logEl.offsetWidth; logEl.classList.add('in'); }
  }

  function paint() {
    nodes.forEach(function (n, i) {
      n.classList.toggle('active', i === stage && i < 2);
      n.classList.toggle('done', i < stage);
    });
    nodes[2].classList.toggle('active', stage >= 2 && stage <= 5);
    tools.forEach(function (t, i) {
      var ts = 3 + i;
      t.classList.remove('run', 'ok', 'queued', 'fail');
      if (failing && i === 1 && stage === 4) t.classList.add('fail');
      else if (stage > ts) t.classList.add('ok');
      else if (stage === ts) t.classList.add('run');
      else if (stage >= 2) t.classList.add('queued');
    });
    wires.forEach(function (w) {
      var on = (w.stage === stage) || (w.stage <= 2 && w.stage === stage) || (stage === 2 && w.stage >= 3) || (w.tool >= 0 && stage === 3 + w.tool);
      w.path.classList.toggle('on', on && !reduce);
      w.path.classList.toggle('fail', failing && w.tool === 1 && stage === 4);
      w.pulse.style.opacity = 0;
      w.active = on;
    });
  }

  function go(s, fromClick) {
    stage = s;
    stageStart = performance.now();
    if (stage === 4 && failArmed) {
      failArmed = false; failing = true; errors += 1;
      setLog(T.failLog, 'err');
    } else if (stage === 5 && failing) {
      failing = false;
      setLog(T.recoverLog);
      setTimeout(function () { if (stage === 5) setLog(T.logs[5]); }, 900 / speed);
    } else {
      setLog(T.logs[stage]);
    }
    if (stage === 6) {
      wf += 1; tokens = Math.round((tokens + 0.01 + Math.random() * 0.02) * 100) / 100;
      latency = 320 + Math.round(Math.random() * 48);
      renderStats(true);
    } else if (!fromClick) renderStats(false);
    paint();
    schedule();
  }
  function next() { go((stage + 1) % 7); }
  function schedule() {
    clearTimeout(timer);
    if (!playing) return;
    var mult = (stage === 4 && failing) ? 1.8 : (stage === 6 ? 1.3 : 1);
    timer = setTimeout(next, (STEP_MS * mult) / speed);
  }

  /* travelling pulses */
  var raf = 0, visible = true;
  function loop(t) {
    raf = requestAnimationFrame(loop);
    if (!playing) return;
    var k = Math.min(1, (t - stageStart) / (STEP_MS * 0.7 / speed));
    wires.forEach(function (w) {
      if (!w.active) return;
      var u = w.stage === 2 && stage === 2 ? k : (k * 1.4) % 1;
      try {
        var pt = w.path.getPointAtLength(w.len * u);
        w.pulse.setAttribute('cx', pt.x); w.pulse.setAttribute('cy', pt.y);
        w.pulse.style.opacity = u < 0.98 ? 1 : 0;
      } catch (e) { /* path detached during resize */ }
    });
  }
  function startLoop() { if (!raf && !reduce && visible) raf = requestAnimationFrame(loop); }
  function stopLoop() { if (raf) cancelAnimationFrame(raf); raf = 0; }

  /* ---- controls ---- */
  var playBtn = $('#play'), playTxt = $('#playTxt'), playIco = $('#playIco'), live = $('#live'), titleEl = $('#pl-title');
  var ICO_PAUSE = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  var ICO_PLAY = '<path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/>';
  function setPlaying(p) {
    playing = p;
    playTxt.textContent = p ? T.pause : T.play;
    playIco.innerHTML = p ? ICO_PAUSE : ICO_PLAY;
    playBtn.setAttribute('aria-pressed', String(!p));
    live.classList.toggle('paused', !p);
    titleEl.textContent = p ? T.title : T.paused;
    if (p) { stageStart = performance.now(); schedule(); startLoop(); }
    else { clearTimeout(timer); wires.forEach(function (w) { w.pulse.style.opacity = 0; }); }
  }
  playBtn.addEventListener('click', function () { setPlaying(!playing); });
  $('#step').addEventListener('click', function () { if (playing) setPlaying(false); next(); });
  $('#speed').addEventListener('click', function () {
    speed = speed === 1 ? 2 : (speed === 2 ? 0.5 : 1);
    var lbl = (speed === 0.5 ? '0.5' : String(speed)) + '×';
    $('#speedTxt').textContent = lang === 'fa' ? fa(lbl).replace('.', '٫') : lbl;
    this.setAttribute('aria-pressed', String(speed !== 1));
    if (playing) schedule();
  });
  $('#fail').addEventListener('click', function () {
    failArmed = true;
    if (stage >= 4) go(3, true); else if (!playing) go(Math.max(stage, 3), true);
  });
  nodes.forEach(function (n) { n.addEventListener('click', function () { go(+n.getAttribute('data-step'), true); }); });
  tools.forEach(function (t) { t.addEventListener('click', function () { go(3 + (+t.getAttribute('data-tool')), true); }); });

  /* ---- lifecycle ---- */
  var ro = null;
  if ('ResizeObserver' in window) { ro = new ResizeObserver(function () { buildWires(); }); ro.observe(flow); }
  else window.addEventListener('resize', buildWires);
  var io = null;
  if ('IntersectionObserver' in window) {
    io = new IntersectionObserver(function (es) {
      visible = es[0].isIntersecting;
      if (visible) startLoop(); else stopLoop();
    });
    io.observe(flow);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stopLoop(); clearTimeout(timer); }
    else { startLoop(); if (playing) schedule(); }
  });
  window.addEventListener('pagehide', function () { stopLoop(); clearTimeout(timer); if (ro) ro.disconnect(); if (io) io.disconnect(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildWires);

  buildWires();
  if (reduce) {
    // static, complete snapshot: LLM done, tools fanned out
    stage = 3; setLog(T.logs[2]); renderStats(false); paint();
    setPlaying(false);
  } else {
    stage = 2; setLog(T.logs[2]); renderStats(false); paint(); schedule(); startLoop();
  }
})();
</script>
</body>
</html>
