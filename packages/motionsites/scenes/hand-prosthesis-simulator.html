<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Prosthesis Simulator</title>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var l = p.get('lang') === 'fa' ? 'fa' : 'en';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --page: #000;
    --frame: #0c0c0d;
    --panel: #131314;
    --panel-2: #19191b;
    --field: #1c1c1f;
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.12);
    --text: #f4f4f5;
    --muted: #8a8a90;
    --dim: #5c5c62;
    --accent: #ff3d1f;
    --gold: #d6a531;
    --radius: 18px;
    --left-w: 280px;
    --right-w: 252px;
    --font: 'Inter', system-ui, sans-serif;
  }
  html[lang="fa"] { --font: 'Vazirmatn', 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: radial-gradient(120% 50% at 50% 110%, rgba(120,80,10,.28), transparent 60%) fixed, var(--page); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; overflow-x: hidden; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  /* ---------- gold particle backdrop ---------- */
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }

  /* ---------- app frame ---------- */
  main.page { position: relative; z-index: 1; min-height: 100vh; padding: 28px clamp(12px, 3vw, 40px); display: grid; place-items: center; }
  .app {
    width: 100%; max-width: 1480px; height: min(calc(100vh - 56px), 900px); min-height: 600px;
    background: var(--frame); border: 1px solid var(--line); border-radius: 26px;
    box-shadow: 0 40px 120px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.04);
    display: grid; grid-template-columns: var(--left-w) 1fr; grid-template-rows: auto 1fr;
    grid-template-areas: "back stage" "left stage";
    gap: 14px 6px; padding: 12px; overflow: hidden;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.985); } to { opacity: 1; transform: none; } }

  .back {
    grid-area: back; display: flex; align-items: center; gap: 10px; height: 40px; padding-inline: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; font-weight: 500;
    text-align: start; transition: background .2s, border-color .2s;
  }
  .back:hover { background: var(--panel-2); border-color: var(--line-2); }
  .back svg { width: 14px; height: 14px; }
  html[dir="rtl"] .back svg, html[dir="rtl"] .flip { transform: scaleX(-1); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }

  /* ---------- left panel ---------- */
  .left { grid-area: left; padding: 18px 16px 16px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a2a2d transparent; animation: slideL .8s .15s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes slideL { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
  html[dir="rtl"] .left { animation-name: slideR; }
  @keyframes slideR { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
  .h { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -.01em; }
  .sub-h { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 8px; font-size: 11.5px; color: var(--muted); }
  .sub-h:first-of-type { margin-top: 14px; }
  .icon-btn { display: inline-grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; background: transparent; color: var(--dim); border-radius: 6px; transition: color .2s, background .2s; }
  .icon-btn:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .icon-btn[aria-pressed="true"] { color: var(--accent); }
  .icon-btn svg { width: 13px; height: 13px; }
  .xyz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .num {
    display: flex; align-items: center; gap: 6px; height: 32px; padding-inline: 9px; background: var(--field);
    border: 1px solid transparent; border-radius: 9px; transition: border-color .2s, background .2s; min-width: 0;
  }
  .num:focus-within { border-color: rgba(255,255,255,.35); background: #202024; }
  .num.is-active { border-color: rgba(255,255,255,.28); }
  .num b { font-size: 10.5px; font-weight: 500; color: var(--dim); cursor: ew-resize; user-select: none; touch-action: none; }
  .num input { width: 100%; min-width: 0; border: 0; background: transparent; outline: none; font-size: 12px; font-weight: 500; padding: 0; font-variant-numeric: tabular-nums; }
  .sep { height: 1px; background: var(--line); margin: 18px 0 16px; }
  .params-h { display: flex; align-items: center; justify-content: space-between; }
  .badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding-inline: 9px; background: #fff; color: #0c0c0d; border-radius: 999px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .badge svg { width: 10px; height: 10px; }
  .slider { margin-top: 13px; }
  .slider .row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; margin-bottom: 9px; }
  .slider .row output { font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 14px; margin: 0; background: transparent; cursor: pointer; --p: 50%;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(to right, #4a4a50 var(--p), #262629 var(--p)); }
  html[dir="rtl"] input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(to left, #4a4a50 var(--p), #262629 var(--p)); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: #262629; }
  input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: #4a4a50; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border-radius: 50%; background: var(--accent); border: 2.5px solid #fff; box-shadow: 0 0 0 4px rgba(255,61,31,.0); transition: box-shadow .2s, transform .2s; }
  input[type=range]::-moz-range-thumb { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2.5px solid #fff; }
  input[type=range]:hover::-webkit-slider-thumb, input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 5px rgba(255,61,31,.22); transform: scale(1.1); }
  input[type=range]:focus-visible { outline: none; }
  .weights { margin-top: 15px; }
  .weights .lab { font-size: 11.5px; color: var(--muted); margin-bottom: 9px; }
  .wbox { position: relative; display: grid; grid-template-columns: var(--palm, 65%) 1fr; height: 46px; background: var(--field); border-radius: 10px; overflow: hidden; transition: grid-template-columns .4s ease; }
  .wbox div { padding: 7px 10px; display: flex; flex-direction: column; justify-content: space-between; }
  .wbox div + div { border-inline-start: 1px solid var(--line-2); }
  .wbox small { font-size: 9.5px; color: var(--dim); }
  .wbox strong { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- stage ---------- */
  .stage { grid-area: stage; position: relative; border-radius: 20px; overflow: hidden; min-height: 0; }
  .vp { position: absolute; inset: 0; background: radial-gradient(60% 55% at 45% 45%, #17171a 0%, #0c0c0d 70%); }
  .vp canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; }
  .vp canvas.dragging { cursor: grabbing; }
  .vp .fallback { position: absolute; inset: 0; display: none; place-items: center; text-align: center; color: var(--muted); font-size: 13px; }
  .vp.no-gl .fallback { display: grid; }
  .vp .fallback svg { width: 160px; height: 220px; margin-bottom: 12px; opacity: .7; }
  .top { position: absolute; inset-inline: 18px; top: 10px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 2; }
  .top > * { pointer-events: auto; }
  .title h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.025em; }
  .title p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
  .modes { display: flex; gap: 2px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .modes button { width: 30px; height: 30px; display: grid; place-items: center; border: 0; background: transparent; color: var(--dim); border-radius: 8px; transition: background .2s, color .2s; }
  .modes button svg { width: 15px; height: 15px; }
  .modes button:hover { color: var(--text); }
  .modes button[aria-pressed="true"] { background: #26262a; color: #fff; }
  .hint { position: absolute; inset-inline-start: 18px; bottom: 18px; font-size: 11px; color: var(--dim); z-index: 2; pointer-events: none; transition: opacity .6s; }
  .toolbar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 6px; padding: 5px; background: rgba(19,19,20,.85); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); z-index: 2; }
  .toolbar button { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 9px; background: transparent; color: #cfcfd4; transition: background .2s, transform .15s; }
  .toolbar button:hover { background: #26262a; }
  .toolbar button:active { transform: scale(.92); }
  .toolbar button.primary { background: var(--accent); color: #fff; box-shadow: 0 6px 18px rgba(255,61,31,.35); }
  .toolbar button.primary:hover { background: #ff5436; }
  .toolbar button[aria-pressed="true"] { background: #2c2c30; color: var(--accent); }
  .toolbar svg { width: 15px; height: 15px; }

  /* ---------- right panels ---------- */
  .right { position: absolute; top: 70px; inset-inline-end: 10px; width: var(--right-w); display: flex; flex-direction: column; gap: 10px; z-index: 3; max-height: calc(100% - 80px); animation: slideR .8s .25s cubic-bezier(.2,.8,.2,1) both; }
  html[dir="rtl"] .right { animation-name: slideL; }
  .right .card { background: rgba(19,19,20,.9); backdrop-filter: blur(14px); padding: 14px 12px 12px; }
  .ph { display: flex; justify-content: space-between; align-items: center; padding-inline: 2px; }
  .ph .icon-btn svg { transition: transform .3s; }
  .card.collapsed .ph .icon-btn svg { transform: rotate(180deg); }
  .pbody { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .35s ease, opacity .3s; }
  .pbody > div { overflow: hidden; min-height: 0; }
  .card.collapsed .pbody { grid-template-rows: 0fr; opacity: 0; }
  .search { display: flex; align-items: center; gap: 7px; height: 30px; margin-top: 12px; padding-inline: 9px; background: var(--field); border-radius: 8px; border: 1px solid transparent; }
  .search:focus-within { border-color: var(--line-2); }
  .search svg { width: 12px; height: 12px; color: var(--dim); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 11.5px; }
  .search input::placeholder { color: var(--dim); }
  .tree { list-style: none; margin: 10px 0 0; padding: 0; max-height: 196px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a2a2d transparent; }
  .tree li { display: flex; align-items: center; border-radius: 8px; transition: background .2s; }
  .tree li:hover { background: rgba(255,255,255,.03); }
  .tree li.sel { background: #222225; }
  .tree li[hidden] { display: none; }
  .tree .pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 30px; padding-inline: calc(8px + var(--d, 0) * 16px) 4px; border: 0; background: transparent; text-align: start; font-size: 11.5px; color: #d9d9de; }
  .tree .pick span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree .pick svg { width: 10px; height: 10px; flex: none; color: var(--dim); }
  .tree li.sel .pick svg { color: var(--accent); }
  .tree li.off .pick { color: var(--dim); }
  .tree .eye, .tree .caret { opacity: 0; }
  .tree li:hover .eye, .tree li.sel .eye, .tree li.off .eye, .tree .eye:focus-visible, .tree .caret { opacity: 1; }
  .tree .caret svg { transition: transform .25s; }
  .tree li.closed .caret svg { transform: rotate(-90deg); }
  html[dir="rtl"] .tree li.closed .caret svg { transform: rotate(90deg); }
  .tree .empty { font-size: 11px; color: var(--dim); padding: 8px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; }
  .chip { display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; border: 0; border-radius: 8px; background: var(--field); font-size: 11px; font-weight: 500; white-space: nowrap; transition: background .2s, transform .15s; }
  .chip:hover { background: #26262a; }
  .chip:active { transform: scale(.96); }
  .chip.running { background: #2c1712; color: #ffb4a4; }
  .chip svg { width: 10px; height: 10px; }
  .tog { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; height: 26px; padding-inline: 2px; font-size: 11.5px; font-weight: 500; }
  .switch { position: relative; width: 26px; height: 15px; border-radius: 999px; border: 0; padding: 0; background: #2f2f33; transition: background .25s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 2.5px; inset-inline-start: 2.5px; width: 10px; height: 10px; border-radius: 50%; background: #8d8d93; transition: inset-inline-start .25s cubic-bezier(.3,1.4,.5,1), background .25s; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { inset-inline-start: 13.5px; background: #fff; }
  .explode { display: grid; grid-template-columns: 1fr 52px; align-items: end; gap: 8px; margin-top: 8px; padding-inline: 2px; }
  .explode label { display: block; font-size: 11.5px; font-weight: 500; margin-bottom: 9px; }
  .gizmo { width: 52px; height: 52px; }

  .toast { position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 10; background: #f4f4f5; color: #0c0c0d; font-size: 12.5px; font-weight: 500; padding: 10px 16px; border-radius: 12px; transition: opacity .3s, transform .3s; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- responsive ---------- */
  @media (max-width: 1180px) { :root { --left-w: 250px; --right-w: 228px; } }
  @media (max-width: 920px) {
    main.page { padding: 16px; place-items: start center; }
    .app { height: auto; min-height: 0; grid-template-columns: 1fr; grid-template-rows: auto auto auto; grid-template-areas: "back" "stage" "left"; }
    .stage { display: flex; flex-direction: column; gap: 12px; overflow: visible; }
    .vp { position: relative; inset: auto; height: min(72vh, 560px); min-height: 400px; border-radius: 18px; overflow: hidden; }
    .right { position: static; width: auto; max-height: none; display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
    .left { overflow: visible; }
  }
  @media (max-width: 640px) {
    .right { grid-template-columns: 1fr; }
    .title h1 { font-size: 17px; }
    .hint { display: none; }
    .top { inset-inline: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas id="dust" aria-hidden="true"></canvas>
<main class="page">
  <div class="app">
    <button class="back" type="button" id="backBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      <span data-i18n="back">Back to library</span>
    </button>

    <!-- ===== left: transform + parameters ===== -->
    <aside class="left card" aria-labelledby="posH">
      <h2 class="h" id="posH" data-i18n="position">Position</h2>

      <div class="sub-h"><span data-i18n="location">Location</span>
        <button class="icon-btn" type="button" data-reset="loc" data-i18n-aria="reset" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg></button>
      </div>
      <div class="xyz" data-group="loc"></div>

      <div class="sub-h"><span data-i18n="rotation">Rotation</span>
        <button class="icon-btn" type="button" data-reset="rot" data-i18n-aria="reset" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      </div>
      <div class="xyz" data-group="rot"></div>

      <div class="sub-h"><span data-i18n="scale">Scale</span>
        <button class="icon-btn" type="button" id="lockBtn" aria-pressed="true" data-i18n-aria="lock" aria-label="Lock proportions">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M9 17H7a5 5 0 0 1 0-10h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8"/></svg></button>
      </div>
      <div class="xyz" data-group="scl"></div>

      <div class="sep"></div>
      <div class="params-h">
        <h2 class="h" data-i18n="params">Parameters</h2>
        <span class="badge"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3 7 7 .6-5.3 4.6L18.4 22 12 18l-6.4 4 1.7-7.8L2 9.6 9 9z"/></svg><span id="maxKg">Max 6.7 kg</span></span>
      </div>

      <div class="slider"><div class="row"><label for="sWall" data-i18n="wall">Wall thickness</label><output id="oWall" for="sWall"></output></div>
        <input type="range" id="sWall" min="2" max="8" step="0.01" value="5.44"></div>
      <div class="slider"><div class="row"><label for="sFlex" data-i18n="flex">Flexibility</label><output id="oFlex" for="sFlex"></output></div>
        <input type="range" id="sFlex" min="0" max="110" step="1" value="75"></div>
      <div class="slider"><div class="row"><label for="sRot" data-i18n="wristRot">Rotation</label><output id="oRot" for="sRot"></output></div>
        <input type="range" id="sRot" min="0" max="180" step="1" value="90"></div>
      <div class="slider"><div class="row"><label for="sGrip" data-i18n="grip">Grip force</label><output id="oGrip" for="sGrip"></output></div>
        <input type="range" id="sGrip" min="0" max="100" step="1" value="85"></div>

      <div class="weights">
        <div class="lab" data-i18n="weight">Weight distribution</div>
        <div class="wbox" id="wbox">
          <div><small data-i18n="palm">Palm</small><strong id="wPalm">65%</strong></div>
          <div><small data-i18n="wrist">Wrist</small><strong id="wWrist">35%</strong></div>
        </div>
      </div>
    </aside>

    <!-- ===== stage ===== -->
    <section class="stage" aria-labelledby="modelTitle">
      <div class="vp" id="vp">
        <canvas id="gl" aria-label="3D viewport" data-i18n-aria="viewport"></canvas>
        <div class="fallback" aria-hidden="true">
          <div>
            <svg viewBox="0 0 160 220" fill="none" stroke="#6b6b72" stroke-width="2"><rect x="44" y="80" width="72" height="80" rx="14"/><rect x="46" y="22" width="14" height="56" rx="7"/><rect x="64" y="10" width="14" height="68" rx="7"/><rect x="82" y="14" width="14" height="64" rx="7"/><rect x="100" y="28" width="14" height="50" rx="7"/><path d="M44 120 18 88" stroke="#ff3d1f" stroke-width="12" stroke-linecap="round"/><ellipse cx="80" cy="182" rx="30" ry="18"/></svg>
            <div data-i18n="nogl">3D preview needs WebGL.</div>
          </div>
        </div>
        <div class="top">
          <div class="title">
            <h1 id="modelTitle" data-i18n="model">Model – ZM0634</h1>
            <p data-i18n="sub">Hand prosthesis</p>
          </div>
          <div class="modes" role="group" data-i18n-aria="render" aria-label="Render mode">
            <button type="button" data-mode="lines" aria-pressed="false" data-i18n-aria="mLines" aria-label="Wireframe" title="Wireframe">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
            <button type="button" data-mode="solid" aria-pressed="true" data-i18n-aria="mSolid" aria-label="Solid" title="Solid">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/></svg></button>
            <button type="button" data-mode="xray" aria-pressed="false" data-i18n-aria="mXray" aria-label="X-ray" title="X-ray">

});

(function dust() {
  const cv = document.getElementById('dust'); if (!cv) return;
  const ctx = cv.getContext('2d'); if (!ctx) return;
  let W = 0, H = 0, img = null, buf = null, raf = 0, running = true, lastT = 0;
  const COLS = 150, ROWS = 46;
  const hex = (getComputedStyle(document.documentElement).getPropertyValue('--gold').trim() || '#d6a531').replace('#', '');

  }

  const io = new IntersectionObserver(es => { inView = es[0].isIntersecting; start(); }); io.observe(canvas);
  start();
  addEventListener('pagehide', () => { io.disconnect(); ro.disconnect(); cancelAnimationFrame(raf); });
})();
