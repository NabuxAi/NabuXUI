<style>

  html, body { margin: 0; padding: 0; }

  .bg video {

    opacity: 0; transition: opacity 900ms ease;

  .bg video.ready { opacity: 1; }

  .wrap { position: relative; z-index: 10; display: flex; flex-direction: column; min-height: 100vh; min-height: 100svh; }

  .links a { color: rgba(255,255,255,.8); font-size: 14px; letter-spacing: .025em; transition: color 200ms; }

  .btn-grad {

  .login-desk { display: none; }

  .burger svg { position: absolute; width: 24px; height: 24px; transition: all 300ms; }

  .burger .i-x { opacity: 0; transform: rotate(-90deg) scale(.75); }
  .burger[aria-expanded="true"] .i-menu { opacity: 0; transform: rotate(90deg) scale(.75); }
  .burger[aria-expanded="true"] .i-x { opacity: 1; transform: rotate(0) scale(1); }

  @media (min-width: 1024px) {

    .burger { display: none; }

  @media (min-width: 768px) and (max-width: 1023px) { .nav { padding: 20px 48px; } }

  /* ---------- mobile menu ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.4);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    opacity: 0; transition: opacity 400ms;
  }
  .panel { position: absolute; left: 0; right: 0; top: 68px; z-index: 50; }
  .panel-blur { position: absolute; inset: 0; -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border-radius: 0 0 16px 16px; }
  .panel-inner { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 28px 24px 36px; }

  .four-oh-four {
    font-family: "Helvetica Now Var", Helvetica, Inter, Arial, sans-serif;
    font-size: 80px; font-weight: 900; color: #fff; line-height: 1; letter-spacing: -0.05em; user-select: none;

    direction: ltr; display: inline-flex;

  .four-oh-four span { display: inline-block; animation: float 6s ease-in-out infinite; }
  .four-oh-four span:nth-child(2) { animation-delay: -2s; }
  .four-oh-four span:nth-child(3) { animation-delay: -4s; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-0.04em); } }
  .reveal { opacity: 0; transform: translateY(16px); animation: rise 900ms cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: 100ms; } .d2 { animation-delay: 250ms; } .d3 { animation-delay: 450ms; } .d4 { animation-delay: 700ms; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .liquid-glass {
    background: rgba(255,255,255,0.01);
    background-blend-mode: luminosity;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    border: none;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
    position: relative; overflow: hidden;
  }
  .liquid-glass::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .return {
    display: inline-block; color: #fff; font-size: 10px; letter-spacing: .15em; font-weight: 500;

  .return:hover { background-color: rgba(255,255,255,.08); box-shadow: inset 0 1px 1px rgba(255,255,255,.2), 0 0 30px rgba(120,190,255,.25); }
  html[lang="fa"] .return { letter-spacing: 0; font-size: 12px; }

  @media (min-width: 420px) {

  /* ---------- footer ---------- */
  footer { position: relative; z-index: 10; padding: 40px 16px 32px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 24px; }
  .col h2, .news h2 { margin: 0 0 12px; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .15em; }

  .col a:hover { color: rgba(255,255,255,.8); }
  .news { grid-column: span 2; }
  .form { display: flex; max-width: 384px; }
  .form input {
    flex: 1; min-width: 0; background: #fff; color: #111; border: 0; font: inherit; font-size: 12px;

  .form input::placeholder { color: #9ca3af; }
  .form input:focus-visible { box-shadow: inset 0 0 0 2px #22d3ee; }
  .form button {
    background: linear-gradient(to right, var(--grad-from), var(--grad-to)); border: 0; color: #fff; cursor: pointer;

  html[dir="rtl"] .form button { background: linear-gradient(to left, var(--grad-from), var(--grad-to)); }
  .form-msg { min-height: 16px; margin: 6px 0 0; font-size: 11px; color: rgba(255,255,255,.6); }
  .form-msg.err { color: #fca5a5; }
  .form-msg.ok { color: #6ee7b7; }
  .news h2.connect { margin-top: 20px; }
  .social { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; }
  .social a { color: rgba(255,255,255,.5); display: inline-flex; transition: color 200ms, transform 200ms; }
  .social a:hover { color: #fff; transform: translateY(-2px); }
  .social svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  @media (min-width: 640px) {
    footer { padding: 64px 24px 40px; }
    .grid { gap: 32px; }
    .col h2, .news h2 { font-size: 12px; margin-bottom: 16px; }
    .col ul { gap: 10px; }
    .col a { font-size: 12px; }

  }

    footer { padding-inline: 48px; }
    .grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
  }
  @media (min-width: 1024px) {
    footer { padding-inline: 64px; }
    .grid { grid-template-columns: repeat(6, minmax(0,1fr)); gap: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 0ms !important; transition-delay: 0ms !important; }
    .reveal { opacity: 1; transform: none; }
  }
</style>

<script>
(function () {

    var a = document.createElement('a'); a.href = '#'; a.className = 'mlink'; a.textContent = name;
    a.dataset.delay = 350 + i * 50; mob.appendChild(a); mobItems.push(a);
  });
  var mLogin = document.createElement('a');
  mLogin.href = '#'; mLogin.className = 'btn-grad';
  mLogin.innerHTML = '<span></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
  mLogin.firstChild.textContent = t.login;
  mLogin.dataset.delay = 350 + t.links.length * 50;
  mob.appendChild(mLogin); mobItems.push(mLogin);

  // Footer columns (inserted before newsletter)
  var grid = document.getElementById('fgrid');
  var news = grid.querySelector('.news');
  t.cols.forEach(function (c) {
    var col = document.createElement('div'); col.className = 'col';
    var h = document.createElement('h2'); h.textContent = c[0]; col.appendChild(h);
    var ul = document.createElement('ul');
    c[1].forEach(function (l) {
      var li = document.createElement('li'); var a = document.createElement('a');
      a.href = '#'; a.textContent = l; li.appendChild(a); ul.appendChild(li);
    });
    col.appendChild(ul); grid.insertBefore(col, news);
  });

  // Social icons (lucide paths)
  var icons = {
    Facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
    Twitter: '<path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>',
    Dribbble: '<circle cx="12" cy="12" r="10"/><path d="M19.13 5.09C15.22 9.14 10 10.44 2.25 10.94"/><path d="M21.75 12.84c-6.62-1.41-12.14 1-16.38 6.32"/><path d="M8.56 2.75c4.37 6 6 9.42 8 17.72"/>',
    YouTube: '<path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/>',
    LinkedIn: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/>',
    Instagram: '<rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>'
  };
  var social = document.getElementById('social');
  Object.keys(icons).forEach(function (n) {
    var li = document.createElement('li');
    li.innerHTML = '<a href="#" aria-label="' + n + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + icons[n] + '</svg></a>';
    social.appendChild(li);
  });

  // Mobile menu: mount state + visible state, 500ms unmount
  var burger = document.getElementById('burger');
  var menu = document.getElementById('menu');
  var backdrop = document.getElementById('backdrop');
  var closeTimer = null;
  function setDelays(opening) {
    mobItems.forEach(function (el) { el.style.transitionDelay = opening ? el.dataset.delay + 'ms' : '0ms'; });
  }
  function openMenu() {
    clearTimeout(closeTimer);
    menu.hidden = false; burger.setAttribute('aria-expanded', 'true');
    setDelays(true);
    requestAnimationFrame(function () { requestAnimationFrame(function () { menu.classList.add('visible'); }); });
  }
  function closeMenu() {
    burger.setAttribute('aria-expanded', 'false');
    setDelays(false);
    menu.classList.remove('visible');
    closeTimer = setTimeout(function () { menu.hidden = true; }, 500);
  }
  burger.addEventListener('click', function () {
    burger.getAttribute('aria-expanded') === 'true' ? closeMenu() : openMenu();
  });
  backdrop.addEventListener('click', closeMenu);
  mobItems.forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); closeMenu(); }); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && burger.getAttribute('aria-expanded') === 'true') { closeMenu(); burger.focus(); }
  });
  var mq = window.matchMedia('(min-width: 1024px)');
  function onMq() { if (mq.matches && !menu.hidden) { clearTimeout(closeTimer); menu.classList.remove('visible'); menu.hidden = true; burger.setAttribute('aria-expanded', 'false'); } }
  if (mq.addEventListener) mq.addEventListener('change', onMq);

  // Newsletter validation
  var form = document.getElementById('form');
  var input = document.getElementById('email');
  var msg = document.getElementById('msg');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value.trim();
    var ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    msg.textContent = ok ? t.ok : t.bad;
    msg.className = 'form-msg ' + (ok ? 'ok' : 'err');
    input.setAttribute('aria-invalid', ok ? 'false' : 'true');
    if (ok) input.value = ''; else input.focus();
  });

  // Video: fade in when playable; respect reduced motion; pause when hidden
  var v = document.getElementById('bgv');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (v) {
    v.muted = true;
    v.addEventListener('loadeddata', function () { v.classList.add('ready'); if (reduce) v.pause(); });
    v.addEventListener('error', function () { v.remove(); });
    if (reduce) { v.removeAttribute('autoplay'); v.pause(); }
    else {
      var p = v.play(); if (p && p.catch) p.catch(function () {});
    }
    document.addEventListener('visibilitychange', function () {
      if (reduce || !v.isConnected) return;
      if (document.hidden) v.pause(); else { var q = v.play(); if (q && q.catch) q.catch(function () {}); }
    });
  }
})();
</script>
</body>
</html>
