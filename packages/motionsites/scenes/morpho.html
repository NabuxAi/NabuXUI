<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORPHO — 3D Particles Simulator</title>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var l = p.get('lang') === 'fa' ? 'fa' : 'en';
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'fa' ? 'rtl' : 'ltr';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #0c0c12;
    --stage-a: #1c1f4a;
    --stage-b: #2b2c63;
    --stage-c: #121433;
    --column: rgba(190, 200, 255, .085);
    --ring: rgba(235, 240, 255, .85);
    --ink: #eef0ff;
    --muted: rgba(220, 225, 255, .45);
    --accent: #7fd6ff;
    --glass: rgba(26, 28, 66, .42);
    --glass-line: rgba(255, 255, 255, .12);
    --radius: 22px;
    --font: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html[lang="fa"] { --font: 'Vazirmatn', 'Inter', system-ui, sans-serif; --mono: 'Vazirmatn', 'JetBrains Mono', monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5; z-index: 0;
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 3px 3px;
  }
  main { position: relative; z-index: 1; padding: clamp(10px, 2.4vw, 32px); }

  .stage {
    position: relative; overflow: hidden; isolation: isolate;
    height: calc(100vh - 2 * clamp(10px, 2.4vw, 32px)); min-height: 560px;
    border-radius: var(--radius);
    background:
      radial-gradient(120% 90% at 50% 45%, var(--stage-b) 0%, var(--stage-a) 45%, var(--stage-c) 100%);
    box-shadow: 0 40px 120px -40px rgba(80, 60, 200, .55), inset 0 0 0 1px rgba(255,255,255,.05);
    touch-action: pan-y;
    opacity: 0; transform: translateY(14px) scale(.985);
    animation: enter 1.1s cubic-bezier(.2,.8,.2,1) .1s forwards;
  }
  @keyframes enter { to { opacity: 1; transform: none; } }

  /* glass column + rings */
  .column {
    position: absolute; inset-block: 0; left: 50%; width: min(57%, 640px); transform: translateX(-50%);
    background: linear-gradient(90deg, rgba(200,210,255,.03), var(--column) 12%, rgba(210,220,255,.06) 50%, var(--column) 88%, rgba(200,210,255,.03));
    border-inline: 1px solid rgba(220, 228, 255, .07);
    pointer-events: none; z-index: 0;
  }
  .ring {
    position: absolute; left: 50%; width: calc(min(57%, 640px) * .95); aspect-ratio: 5.2 / 1;
    transform: translateX(-50%); border-radius: 50%;
    border: 1.5px solid var(--ring);
    box-shadow: 0 0 18px rgba(200, 215, 255, .35), inset 0 0 14px rgba(200, 215, 255, .18);
    pointer-events: none; z-index: 2;
  }
  .ring.top { top: 0; transform: translate(-50%, -52%); }
  .ring.top::after {
    content: ""; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; border-radius: 50%;
    transform: translateX(-50%); background: #fff; box-shadow: 0 0 14px 4px rgba(210, 225, 255, .8);
  }
  .ring.bottom { bottom: 0; transform: translate(-50%, 55%); }
  .glow {
    position: absolute; left: 50%; bottom: 0; width: calc(min(57%, 640px) * .7); aspect-ratio: 2.4 / 1;
    transform: translate(-50%, 58%); border-radius: 50%; pointer-events: none; z-index: 1;
    background: radial-gradient(closest-side, rgba(225, 235, 255, .55), rgba(150, 170, 255, .18) 55%, transparent);
    filter: blur(6px);
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .65; } }

  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; cursor: crosshair; }
  .fallback { position: absolute; inset: 0; display: none; place-items: center; z-index: 1; }
  .fallback svg { width: min(70%, 520px); height: auto; filter: drop-shadow(0 0 30px rgba(120,180,255,.5)); }
  .no-gl .fallback { display: grid; }

  /* HUD */
  .hud { position: absolute; z-index: 3; pointer-events: none; }
  .brand { top: clamp(16px, 2.6vw, 26px); inset-inline-start: clamp(16px, 2.6vw, 28px); }
  .brand b { display: block; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: .32em; }
  .brand span { display: block; margin-top: 5px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  html[lang="fa"] .brand span { letter-spacing: 0; font-size: 11px; }
  .hint { bottom: clamp(14px, 2.2vw, 22px); inset-inline-end: clamp(16px, 2.6vw, 28px); font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  html[lang="fa"] .hint { letter-spacing: 0; font-size: 11px; }
  .count { top: clamp(16px, 2.6vw, 26px); inset-inline-end: clamp(16px, 2.6vw, 28px); font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; color: var(--muted); text-align: end; text-transform: uppercase; }
  .count strong { display: block; color: var(--ink); font-weight: 500; font-size: 12px; letter-spacing: .06em; margin-bottom: 3px; }
  html[lang="fa"] .count { letter-spacing: 0; font-size: 11px; }

  .dash { position: absolute; z-index: 1; height: 1px; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(220,228,255,.35) 0 2px, transparent 2px 6px); opacity: .55; }
  .dash.d1 { top: 30%; left: 7%; width: 9%; }
  .dash.d2 { top: 62%; left: 10%; width: 7%; }
  .dash.d3 { top: 32%; right: 7%; width: 6%; }
  .dash.d4 { top: 62%; right: 9%; width: 9%; }
  .orbit { position: absolute; z-index: 1; left: 12%; top: 46%; width: 70px; height: 22px; border-radius: 50%; border: 1px solid rgba(220,228,255,.22); pointer-events: none; }
  .orbit.o2 { left: auto; right: 15%; top: 70%; width: 14px; height: 30px; }

  /* control dock */
  .dock {
    position: absolute; z-index: 4; bottom: clamp(14px, 2.2vw, 22px); inset-inline-start: clamp(14px, 2.4vw, 24px);
    display: flex; flex-direction: column; gap: 10px; padding: 12px;
    width: min(300px, calc(100% - 28px));
    border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-line);
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 20px 50px -20px rgba(0,0,0,.6);
    opacity: 0; transform: translateY(10px);
    animation: enter .9s cubic-bezier(.2,.8,.2,1) .7s forwards;
  }
  .dock .label { font-family: var(--mono); font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
  html[lang="fa"] .dock .label { letter-spacing: 0; font-size: 11px; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; border-radius: 11px; background: rgba(0,0,0,.25); position: relative; }
  .tab {
    position: relative; z-index: 1; appearance: none; border: 0; background: transparent; color: var(--muted);
    font: 500 12px/1 var(--font); padding: 8px 4px; border-radius: 8px; cursor: pointer; transition: color .25s;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tab i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab-ind { position: absolute; z-index: 0; top: 3px; bottom: 3px; border-radius: 8px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); transition: inset-inline-start .4s cubic-bezier(.3,1.3,.5,1), width .4s; }
  .btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .btn {
    appearance: none; cursor: pointer; border-radius: 10px; padding: 8px 6px;
    border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: var(--ink);
    font: 500 11.5px/1.1 var(--font); display: inline-flex; flex-direction: column; align-items: center; gap: 5px;
    transition: background .25s, border-color .25s, transform .15s;
  }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .btn:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.2); }
  .btn:active { transform: scale(.96); }
  .btn[aria-pressed="true"] { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .slider { display: flex; align-items: center; gap: 10px; }
  .slider input { flex: 1; accent-color: var(--accent); min-width: 0; }
  .slider output { font-family: var(--mono); font-size: 11px; color: var(--ink); min-width: 3ch; text-align: end; }
  .tab:focus-visible, .btn:focus-visible, .slider input:focus-visible, .dock-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dock-toggle { display: none; }

  @media (max-width: 640px) {
    .stage { min-height: 600px; height: calc(100svh - 20px); }
    .column { width: 74%; }
    .ring { width: calc(74% * .95); }
    .glow { width: calc(74% * .7); }
    .dash, .orbit { display: none; }
    .hint { bottom: auto; top: 58px; inset-inline-start: clamp(16px, 2.6vw, 28px); inset-inline-end: auto; }
    .dock { inset-inline-end: 12px; inset-inline-start: 12px; width: auto; bottom: 12px; }
  }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .stage, .dock { animation: none; opacity: 1; transform: none; }
    .glow { animation: none; }
    .tab-ind { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section class="stage" id="stage" aria-labelledby="ttl">
    <h1 class="sr" id="ttl" data-i18n="title">MORPHO — 3D particle butterfly</h1>
    <div class="column" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="ring top" aria-hidden="true"></div>
    <div class="ring bottom" aria-hidden="true"></div>
    <span class="dash d1" aria-hidden="true"></span><span class="dash d2" aria-hidden="true"></span>
    <span class="dash d3" aria-hidden="true"></span><span class="dash d4" aria-hidden="true"></span>
    <span class="orbit" aria-hidden="true"></span><span class="orbit o2" aria-hidden="true"></span>

    <canvas id="gl" role="img" data-i18n-aria="canvas" aria-label="Interactive particle butterfly"></canvas>
    <div class="fallback" aria-hidden="true">
      <svg viewBox="0 0 400 300">
        <defs>
          <radialGradient id="fl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#bdf0ff"/><stop offset=".6" stop-color="#4aa8ff" stop-opacity=".6"/><stop offset="1" stop-color="#4aa8ff" stop-opacity="0"/></radialGradient>
          <radialGradient id="fr" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d9ccff"/><stop offset=".6" stop-color="#6a5cff" stop-opacity=".6"/><stop offset="1" stop-color="#6a5cff" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse cx="135" cy="95" rx="95" ry="50" transform="rotate(-40 135 95)" fill="url(#fl)"/>
        <ellipse cx="140" cy="205" rx="85" ry="45" transform="rotate(40 140 205)" fill="url(#fl)"/>
        <ellipse cx="265" cy="95" rx="95" ry="50" transform="rotate(40 265 95)" fill="url(#fr)"/>
        <ellipse cx="260" cy="205" rx="85" ry="45" transform="rotate(-40 260 205)" fill="url(#fr)"/>
        <path d="M200 60 V240 M200 60 Q195 30 185 15 M200 60 Q205 30 215 15" stroke="#ffc46b" stroke-width="3" fill="none"/>
      </svg>
    </div>

    <div class="hud brand"><b>MORPHO</b><span data-i18n="sub">Particle study · 001</span></div>
    <div class="hud count" aria-live="polite"><strong id="countN">0</strong><span data-i18n="particles">particles</span></div>
    <div class="hud hint" id="hint" data-i18n="hint">Move cursor over the wings</div>

    <div class="dock" role="group" data-i18n-aria="controls" aria-label="Simulator controls">
      <div class="label"><span data-i18n="palette">Palette</span><span id="palName" data-i18n="p_morpho">Morpho</span></div>
      <div class="tabs" role="tablist" data-i18n-aria="palette" aria-label="Palette">
        <span class="tab-ind" aria-hidden="true"></span>
        <button class="tab" role="tab" aria-selected="true" data-pal="morpho"><i style="background:linear-gradient(90deg,#5ccfff,#6d5cff)"></i><span data-i18n="p_morpho">Morpho</span></button>
        <button class="tab" role="tab" aria-selected="false" data-pal="aurora"><i style="background:linear-gradient(90deg,#5cffc8,#3a9bff)"></i><span data-i18n="p_aurora">Aurora</span></button>
        <button class="tab" role="tab" aria-selected="false" data-pal="ember"><i style="background:linear-gradient(90deg,#ff9a5c,#ff4f8b)"></i><span data-i18n="p_ember">Ember</span></button>
      </div>
      <div class="btns">
        <button class="btn" id="bFlap" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v13M12 9C9 3 3 4 3 9s5 6 9 3M12 9c3-6 9-5 9 0s-5 6-9 3"/></svg>
          <span data-i18n="flap">Flap</span>
        </button>
        <button class="btn" id="bSweep">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20 20 4M4 13l7-7M13 20l7-7"/></svg>
          <span data-i18n="sweep">Light sweep</span>
        </button>
        <button class="btn" id="bScatter" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="6" r="1.4"/><circle cx="18" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="6" cy="18" r="1.4"/><circle cx="19" cy="17" r="1.4"/></svg>
          <span data-i18n="scatter">Scatter</span>
        </button>
      </div>
      <label class="slider"><span class="label" style="flex:none" data-i18n="intensity">Wind</span>
        <input type="range" id="rWind" min="0" max="100" value="60" data-i18n-aria="intensity" aria-label="Wind">
        <output id="oWind" for="rWind">60</output>
      </label>
    </div>
  </section>
</main>

<script type="module">
const LANG = document.documentElement.lang === 'fa' ? 'fa' : 'en';
const I18N = {
  en: { title: 'MORPHO — 3D particle butterfly', sub: 'Particle study · 001', particles: 'particles', hint: 'Move cursor over the wings', hintTouch: 'Drag across the wings',
        palette: 'Palette', p_morpho: 'Morpho', p_aurora: 'Aurora', p_ember: 'Ember', flap: 'Flap', sweep: 'Light sweep', scatter: 'Scatter', reform: 'Reform',
        intensity: 'Wind', controls: 'Simulator controls', canvas: 'Interactive particle butterfly; its wings react to the pointer' },
  fa: { title: 'مورفو — پروانهٔ ذره‌ای سه‌بعدی', sub: 'مطالعهٔ ذرات · ۰۰۱', particles: 'ذره', hint: 'نشانگر را روی بال‌ها حرکت دهید', hintTouch: 'انگشتتان را روی بال‌ها بکشید',
        palette: 'پالت رنگ', p_morpho: 'مورفو', p_aurora: 'شفق', p_ember: 'اخگر', flap: 'بال‌زدن', sweep: 'جاروی نور', scatter: 'پراکندن', reform: 'بازسازی',
        intensity: 'باد', controls: 'کنترل‌های شبیه‌ساز', canvas: 'پروانهٔ ذره‌ای تعاملی؛ بال‌هایش به نشانگر واکنش نشان می‌دهند' }
};
const T = I18N[LANG];
document.title = LANG === 'fa' ? 'مورفو — شبیه‌ساز ذرات سه‌بعدی' : 'MORPHO — 3D Particles Simulator';
document.querySelectorAll('[data-i18n]').forEach((el) => { const k = el.dataset.i18n; if (T[k]) el.textContent = T[k]; });
document.querySelectorAll('[data-i18n-aria]').forEach((el) => { const k = el.dataset.i18nAria; if (T[k]) el.setAttribute('aria-label', T[k]); });
const fmt = (n) => n.toLocaleString(LANG === 'fa' ? 'fa-IR' : 'en-US');
const coarse = matchMedia('(pointer: coarse)').matches;
if (coarse) document.getElementById('hint').textContent = T.hintTouch;

const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = reduceMQ.matches;

/* ---------- config ---------- */
const CONFIG = {
  particles: innerWidth < 640 ? 18000 : 34000,
  stars: 260,
  flapSpeed: 1.25,     // rad/s multiplier
  flapAmp: 0.42,       // radians
  cursorRadius: 0.75,  // world units
  spring: 0.035,
  damping: 0.88,
};
const PALETTES = {
  morpho: { left: ['#3fb8ff', '#8fe6ff'], right: ['#4b55ff', '#9a7bff'], body: ['#ff9d3c', '#ffd98a'], accent: '#7fd6ff', name: 'p_morpho' },
  aurora: { left: ['#2fe0b0', '#9effd9'], right: ['#2f7dff', '#59d4ff'], body: ['#fff1a8', '#ffffff'], accent: '#6cf5c8', name: 'p_aurora' },
  ember:  { left: ['#ff8a3d', '#ffc06b'], right: ['#ff3f7f', '#c04bff'], body: ['#ffe28a', '#fff4d6'], accent: '#ff9a6b', name: 'p_ember' },
};

/* ---------- UI ---------- */
const stage = document.getElementById('stage');
const tabs = [...document.querySelectorAll('.tab')];
const ind = document.querySelector('.tab-ind');
const palName = document.getElementById('palName');
function placeInd(btn) {
  if (!ind || !btn) return;
  const p = btn.parentElement.getBoundingClientRect(), r = btn.getBoundingClientRect();
  const start = LANG === 'fa' ? p.right - r.right : r.left - p.left;
  ind.style.insetInlineStart = start + 'px';
  ind.style.width = r.width + 'px';
}
let api = null;
function selectPal(key, focus) {
  tabs.forEach((t) => { const on = t.dataset.pal === key; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1; if (on) { placeInd(t); if (focus) t.focus(); } });
  palName.textContent = T[PALETTES[key].name];
  document.documentElement.style.setProperty('--accent', PALETTES[key].accent);
  api && api.setPalette(key);
}
tabs.forEach((t, i) => {
  t.addEventListener('click', () => selectPal(t.dataset.pal));
  t.addEventListener('keydown', (e) => {
    const dirKey = LANG === 'fa' ? { ArrowLeft: 1, ArrowRight: -1 } : { ArrowLeft: -1, ArrowRight: 1 };
    if (dirKey[e.key]) { e.preventDefault(); selectPal(tabs[(i + dirKey[e.key] + tabs.length) % tabs.length].dataset.pal, true); }
  });
});
requestAnimationFrame(() => placeInd(tabs[0]));
document.fonts && document.fonts.ready.then(() => placeInd(tabs.find((t) => t.getAttribute('aria-selected') === 'true')));
addEventListener('resize', () => placeInd(tabs.find((t) => t.getAttribute('aria-selected') === 'true')));

const bFlap = document.getElementById('bFlap');
const bSweep = document.getElementById('bSweep');
const bScatter = document.getElementById('bScatter');
const rWind = document.getElementById('rWind');
const oWind = document.getElementById('oWind');
oWind.textContent = fmt(+rWind.value);
if (reduced) bFlap.setAttribute('aria-pressed', 'false');
bFlap.addEventListener('click', () => { const on = bFlap.getAttribute('aria-pressed') !== 'true'; bFlap.setAttribute('aria-pressed', on); api && api.setFlap(on); });
bSweep.addEventListener('click', () => api && api.sweep());
bScatter.addEventListener('click', () => {
  const on = bScatter.getAttribute('aria-pressed') !== 'true';
  bScatter.setAttribute('aria-pressed', on);
  bScatter.querySelector('span').textContent = on ? T.reform : T.scatter;
  api && api.setScatter(on);
});
rWind.addEventListener('input', () => { oWind.textContent = fmt(+rWind.value); api && api.setWind(+rWind.value / 100); });

/* ---------- count-up ---------- */
const countEl = document.getElementById('countN');
function countUp(target) {
  if (reduced) { countEl.textContent = fmt(target); return; }
  const t0 = performance.now();
  const step = (now) => { const k = Math.min(1, (now - t0) / 1400); countEl.textContent = fmt(Math.round(target * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- WebGL ---------- */
let THREE;
try {
  THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
} catch (e) { THREE = null; }

function noGL() { stage.classList.add('no-gl'); countEl.textContent = fmt(0); }

if (!THREE) noGL(); else {
  try { api = init(THREE); countUp(CONFIG.particles); }
  catch (e) { noGL(); }
}

function init(THREE) {
  const canvas = document.getElementById('gl');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  const group = new THREE.Group();
  scene.add(group);

  /* --- build butterfly home positions --- */
  const N = CONFIG.particles;
  const home = new Float32Array(N * 3);
  const pos = new Float32Array(N * 3);
  const vel = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const tgtCol = new Float32Array(N * 3);
  const size = new Float32Array(N);
  const heat = new Float32Array(N);
  const kind = new Uint8Array(N);   // 0 left wing, 1 right wing, 2 body
  const mixv = new Float32Array(N);
  const radial = new Float32Array(N); // 0 at root → 1 at tip (for colour glow)
  const scatterOff = new Float32Array(N * 3);
  const start = new Float32Array(N * 3);

  const rnd = Math.random;
  const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
  // lobes: angle (deg from +x), a, b (semi axes), weight
  const LOBES = [
    { ang: 52, a: 1.22, b: 0.62, w: 0.42 },
    { ang: -48, a: 1.08, b: 0.55, w: 0.36 },
    { ang: 4, a: 0.62, b: 0.17, w: 0.10 },
    { ang: 28, a: 0.7, b: 0.22, w: 0.12 },
  ];
  const wsum = LOBES.reduce((s, l) => s + l.w, 0);
  function pickLobe() { let r = rnd() * wsum; for (const l of LOBES) { if ((r -= l.w) <= 0) return l; } return LOBES[0]; }

  const BODY = Math.floor(N * 0.07);
  for (let i = 0; i < N; i++) {
    let x, y, z;
    if (i < BODY) {
      kind[i] = 2;
      const r = rnd();
      if (r < 0.62) { // thorax/abdomen
        y = -1.25 + rnd() * 2.2; x = gauss() * 0.03 * (1 + 0.6 * Math.cos(y)); z = gauss() * 0.03;
      } else { // antennae
        const s = rnd(); const side = rnd() < 0.5 ? -1 : 1;
        y = 0.95 + s * 0.95; x = side * (0.02 + s * 0.17 + 0.04 * Math.sin(s * 3)) + gauss() * 0.012; z = gauss() * 0.012;
      }
      radial[i] = 0;
    } else {
      const side = (i & 1) ? 1 : -1;
      kind[i] = side < 0 ? 0 : 1;
      const L = pickLobe();
      const mode = rnd();
      let r;
      if (mode < 0.42) r = Math.sqrt(rnd()) * 0.98;                // fill
      else if (mode < 0.74) r = 0.9 + gauss() * 0.06;             // outer edge
      else r = 0.56 + gauss() * 0.05;                              // inner ring (eye spot)
      const th = rnd() * Math.PI * 2;
      // ellipse local, then shift so lobe starts near body
      const lx = Math.cos(th) * r * L.a + L.a * 0.98, ly = Math.sin(th) * r * L.b;
      const ang = L.ang * Math.PI / 180;
      x = (lx * Math.cos(ang) - ly * Math.sin(ang)) * side;
      y = lx * Math.sin(ang) + ly * Math.cos(ang);
      z = gauss() * 0.05;
      radial[i] = Math.min(1, Math.hypot(x, y) / 2.3);
    }
    home[i * 3] = x; home[i * 3 + 1] = y; home[i * 3 + 2] = z;
    start[i * 3] = x * 0.2 + gauss() * 2.6; start[i * 3 + 1] = y * 0.2 + gauss() * 2.2; start[i * 3 + 2] = gauss() * 2;
    mixv[i] = rnd();
    size[i] = kind[i] === 2 ? 1.1 + rnd() * 1.2 : 0.7 + Math.pow(rnd(), 3) * 2.2;
    const a = rnd() * Math.PI * 2, b = Math.acos(2 * rnd() - 1), d = 2.5 + rnd() * 3;
    scatterOff[i * 3] = Math.sin(b) * Math.cos(a) * d; scatterOff[i * 3 + 1] = Math.sin(b) * Math.sin(a) * d * 0.7; scatterOff[i * 3 + 2] = Math.cos(b) * d * 0.6;
  }
  pos.set(reduced ? home : start);

  const tmp = new THREE.Color(), c1 = new THREE.Color(), c2 = new THREE.Color(), white = new THREE.Color('#ffffff');
  function paletteInto(arr, key) {
    const P = PALETTES[key];
    for (let i = 0; i < N; i++) {
      const k = kind[i]; const pair = k === 0 ? P.left : k === 1 ? P.right : P.body;
      c1.set(pair[0]); c2.set(pair[1]);
      tmp.copy(c1).lerp(c2, mixv[i]);
      if (k !== 2) tmp.lerp(white, Math.max(0, 0.45 - radial[i]) * 1.1); // whiter root glow
      arr[i * 3] = tmp.r; arr[i * 3 + 1] = tmp.g; arr[i * 3 + 2] = tmp.b;
    }
  }
  paletteInto(col, 'morpho'); tgtCol.set(col);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aHeat', new THREE.BufferAttribute(heat, 1).setUsage(THREE.DynamicDrawUsage));
  const uniforms = { uPix: { value: 1 }, uScale: { value: 1 } };
  const mat = new THREE.ShaderMaterial({
    uniforms, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true,
    vertexShader: `
      attribute float aSize; attribute float aHeat;
      uniform float uPix; uniform float uScale;
      varying vec3 vCol; varying float vHeat;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vCol = color; vHeat = aHeat;
        gl_PointSize = aSize * (1.0 + aHeat * 1.4) * uPix * uScale * (7.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying vec3 vCol; varying float vHeat;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        float a = smoothstep(0.5, 0.0, d);
        vec3 c = mix(vCol, vec3(1.0), clamp(vHeat * 0.85, 0.0, 0.9));
        gl_FragColor = vec4(c * (0.62 + vHeat * 1.6), a * 0.85);
      }`,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  group.add(points);

  /* stars */
  const S = CONFIG.stars, sp = new Float32Array(S * 3), ss = new Float32Array(S), sc = new Float32Array(S * 3), sh = new Float32Array(S);
  for (let i = 0; i < S; i++) {
    sp[i * 3] = (rnd() - 0.5) * 22; sp[i * 3 + 1] = (rnd() - 0.5) * 12; sp[i * 3 + 2] = -3 - rnd() * 6;
    ss[i] = 0.6 + Math.pow(rnd(), 6) * 6; sc[i * 3] = 0.8; sc[i * 3 + 1] = 0.85; sc[i * 3 + 2] = 1;
  }
  const sgeo = new THREE.BufferGeometry();
  sgeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  sgeo.setAttribute('color', new THREE.BufferAttribute(sc, 3));
  sgeo.setAttribute('aSize', new THREE.BufferAttribute(ss, 1));
  sgeo.setAttribute('aHeat', new THREE.BufferAttribute(sh, 1));
  const stars = new THREE.Points(sgeo, mat);
  scene.add(stars);

  /* --- state --- */
  let flap = !reduced, scatter = false, wind = 0.6, palKey = 'morpho', colorT = 0;
  let sweepX = null; // world x of light sweep band
  const mouse = { x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, active: false, last: 0 };
  const ndc = new THREE.Vector2(), ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit = new THREE.Vector3();
  let tilt = { x: 0, y: 0, tx: 0, ty: 0 };
  let fitScale = 1;

  function resize() {
    const r = stage.getBoundingClientRect();
    const w = Math.max(1, r.width), h = Math.max(1, r.height);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const halfFov = (camera.fov * Math.PI / 180) / 2;
    const needH = 2.25 / Math.tan(halfFov);
    const needW = 2.75 / (Math.tan(halfFov) * camera.aspect);
    camera.position.set(0, 0, Math.max(needH, needW));
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    uniforms.uPix.value = renderer.getPixelRatio();
    uniforms.uScale.value = Math.max(0.7, Math.min(1.4, h / 760));
    fitScale = camera.position.z;
    kick();
  }

  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    // pointer plane rotates with the group; approximate by un-rotating
    if (!ray.ray.intersectPlane(plane, hit)) return null;
    return { x: hit.x, y: hit.y, nx: ndc.x, ny: ndc.y };
  }
  function onMove(e) {
    const p = toWorld(e); if (!p) return;
    const now = performance.now();
    if (mouse.active) { const dt = Math.max(8, now - mouse.last); mouse.vx = (p.x - mouse.x) / dt * 16; mouse.vy = (p.y - mouse.y) / dt * 16; }
    mouse.x = p.x; mouse.y = p.y; mouse.active = true; mouse.last = now;
    tilt.tx = p.nx * 0.28; tilt.ty = -p.ny * 0.12;
    kick();
  }
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerdown', onMove);
  canvas.addEventListener('pointerleave', () => { mouse.active = false; tilt.tx = 0; tilt.ty = 0; kick(); });
  canvas.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') { mouse.active = false; kick(); } });

  /* --- loop control --- */
  let running = false, visible = true, onScreen = true, energy = 1, t = 0, lastNow = performance.now();
  function kick() { energy = 1; if (!running && visible && onScreen) { running = true; lastNow = performance.now(); requestAnimationFrame(frame); } }
  const io = new IntersectionObserver((ents) => { onScreen = ents[0].isIntersecting; if (onScreen) kick(); }, { threshold: 0 });
  io.observe(stage);
  document.addEventListener('visibilitychange', () => { visible = !document.hidden; if (visible) kick(); });
  addEventListener('pagehide', () => io.disconnect());

  let intro = reduced ? 1 : 0, introE = 0;
  function step(dt) {
    t += dt;
    if (intro < 1) { intro = Math.min(1, intro + dt / 1.8); introE = 1 - Math.pow(1 - intro, 3); }
    const flapA = flap ? (Math.sin(t * CONFIG.flapSpeed * 2.2) * 0.5 + 0.5) * CONFIG.flapAmp * (0.6 + wind * 0.8) : 0.08;
    const idle = reduced ? 0 : 1;
    const cosA = Math.cos(flapA), sinA = Math.sin(flapA);
    const R = CONFIG.cursorRadius * (0.8 + wind * 0.6), R2 = R * R;
    const mvx = mouse.vx, mvy = mouse.vy;
    const sweepOn = sweepX !== null;
    let moved = 0;
    const k = CONFIG.spring, damp = CONFIG.damping;
    const breath = idle * Math.sin(t * 0.9) * 0.02;
    for (let i = 0; i < N; i++) {
      const i3 = i * 3;
      const hx = home[i3], hy = home[i3 + 1], hz = home[i3 + 2];
      let tx, ty, tz;
      if (kind[i] === 2) { tx = hx; ty = hy + breath; tz = hz; }
      else { const ax = Math.abs(hx); tx = Math.sign(hx) * ax * cosA; tz = hz - ax * sinA; ty = hy + breath; }
      if (scatter) { tx += scatterOff[i3]; ty += scatterOff[i3 + 1]; tz += scatterOff[i3 + 2]; }
      if (intro < 1) {
        const e = introE * (0.85 + 0.15 * Math.min(1, introE + mixv[i] * 0.3));
        pos[i3] = start[i3] + (tx - start[i3]) * e; pos[i3 + 1] = start[i3 + 1] + (ty - start[i3 + 1]) * e; pos[i3 + 2] = start[i3 + 2] + (tz - start[i3 + 2]) * e;
        heat[i] = (1 - introE) * 0.6 * mixv[i];
        continue;
      }
      let px = pos[i3], py = pos[i3 + 1], pz = pos[i3 + 2];
      let vx = vel[i3], vy = vel[i3 + 1], vz = vel[i3 + 2];
      vx += (tx - px) * k; vy += (ty - py) * k; vz += (tz - pz) * k;
      let h = heat[i] * 0.95;
      if (mouse.active) {
        const dx = px - mouse.x, dy = py - mouse.y, d2 = dx * dx + dy * dy;
        if (d2 < R2) {
          const f = 1 - d2 / R2, ff = f * f;
          const inv = 1 / (Math.sqrt(d2) + 0.05);
          // swirl + gentle push + drag along cursor motion
          vx += (-dy * inv * 0.012 + dx * inv * 0.006) * ff * (0.5 + wind) + mvx * ff * 0.09 * (0.4 + wind);
          vy += (dx * inv * 0.012 + dy * inv * 0.006) * ff * (0.5 + wind) + mvy * ff * 0.09 * (0.4 + wind);
          vz += (rnd() - 0.5) * 0.01 * ff;
          h += ff * 0.22;
        }
      }
      if (sweepOn) { const ds = px - sweepX; if (ds > -0.25 && ds < 0.25) h += (1 - Math.abs(ds) / 0.25) * 0.16; }
      vx *= damp; vy *= damp; vz *= damp;
      px += vx; py += vy; pz += vz;
      pos[i3] = px; pos[i3 + 1] = py; pos[i3 + 2] = pz;
      vel[i3] = vx; vel[i3 + 1] = vy; vel[i3 + 2] = vz;
      heat[i] = h > 1.6 ? 1.6 : h;
      moved += Math.abs(vx) + Math.abs(vy);
    }
    mouse.vx *= 0.8; mouse.vy *= 0.8;
    if (sweepOn) { sweepX += dt * 3.2; if (sweepX > 3.2) sweepX = null; }
    if (colorT > 0) {
      for (let i = 0; i < N * 3; i++) col[i] += (tgtCol[i] - col[i]) * 0.08;
      colorT--; geo.attributes.color.needsUpdate = true;
    }
    geo.attributes.position.needsUpdate = true;
    geo.attributes.aHeat.needsUpdate = true;
    return moved / N;
  }

  function frame(now) {
    if (!visible || !onScreen) { running = false; return; }
    const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
    const m = step(dt);
    tilt.x += (tilt.tx - tilt.x) * 0.06; tilt.y += (tilt.ty - tilt.y) * 0.06;
    group.rotation.y = tilt.x + (reduced ? 0 : Math.sin(t * 0.25) * 0.08);
    group.rotation.x = tilt.y;
    stars.rotation.y = tilt.x * 0.3;
    renderer.render(scene, camera);
    if (reduced) {
      energy *= 0.97;
      if (m < 0.0004 && energy < 0.05 && !mouse.active && sweepX === null && colorT <= 0) { running = false; return; }
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  kick();
  if (!reduced) setTimeout(() => { sweepX = -3.2; kick(); }, 1600);

  reduceMQ.addEventListener && reduceMQ.addEventListener('change', (e) => { reduced = e.matches; if (reduced) { flap = false; bFlap.setAttribute('aria-pressed', 'false'); } kick(); });

  return {
    setPalette(key) { palKey = key; paletteInto(tgtCol, key); colorT = reduced ? 1 : 60; if (reduced) { col.set(tgtCol); geo.attributes.color.needsUpdate = true; colorT = 0; } kick(); },
    setFlap(on) { flap = on; kick(); },
    setScatter(on) { scatter = on; kick(); },
    setWind(v) { wind = v; kick(); },
    sweep() { sweepX = -3.2; kick(); },
  };
}
</script>
</body>
</html>
