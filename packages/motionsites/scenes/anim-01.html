<html lang="en" dir="ltr" data-theme="dark">

<title>Superdesign — Infinite Canvas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f;
    --dot: rgba(255, 255, 255, .085);
    --panel: rgba(19, 20, 27, .78);
    --panel-solid: #14151c;
    --line: rgba(255, 255, 255, .08);
    --line-2: rgba(255, 255, 255, .14);
    --text: #eceef5;
    --muted: #8a8ea3;
    --card: #111218;
    --card-2: #1a1b24;
    --card-3: #23242f;
    --accent: #8b5cf6;
    --accent-2: #22d3ee;
    --good: #34d399;
    --edge: rgba(167, 152, 255, .42);
    --glow: rgba(139, 92, 246, .38);
    --shadow: 0 12px 34px rgba(0, 0, 0, .45);
    --radius: 16px;
    --font: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f3f6;
    --dot: rgba(20, 20, 40, .14);
    --panel: rgba(255, 255, 255, .82);
    --panel-solid: #ffffff;
    --line: rgba(15, 15, 30, .09);
    --line-2: rgba(15, 15, 30, .16);
    --text: #15161d;
    --muted: #6b6f82;
    --card: #ffffff;
    --card-2: #f4f4f8;
    --card-3: #e9e9f0;
    --edge: rgba(110, 86, 230, .45);
    --glow: rgba(139, 92, 246, .28);
    --shadow: 0 10px 30px rgba(30, 30, 60, .12);
    color-scheme: light;
  }
  html[lang="fa"] { --font: 'Vazirmatn', 'Inter', system-ui, sans-serif; --mono: 'Vazirmatn', 'JetBrains Mono', monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- canvas ---------- */
  .canvas {
    position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: default;
    background-color: var(--bg);
    background-image: radial-gradient(circle, var(--dot) 1.1px, transparent 1.4px);
    background-size: 22px 22px;
    outline: none;
  }
  .canvas.no-grid { background-image: none; }
  .canvas.tool-hand, .canvas.space { cursor: grab; }
  .canvas.is-panning { cursor: grabbing; }
  .canvas.tool-note { cursor: crosshair; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,.35)); }
  :root[data-theme="light"] .vignette { background: radial-gradient(120% 90% at 50% 40%, transparent 60%, rgba(40,40,80,.06)); }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  .edges path { fill: none; vector-effect: non-scaling-stroke; }
  .edges .base { stroke: var(--edge); stroke-width: 1.5; }
  .edges .flow { stroke: var(--accent-2); stroke-width: 1.5; stroke-dasharray: 3 14; opacity: .75; animation: flow 1.1s linear infinite; }
  .edges .pending .flow { stroke: var(--accent); stroke-dasharray: 6 8; animation-duration: .5s; opacity: 1; }
  .edges circle { fill: var(--bg); stroke: var(--edge); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  @keyframes flow { to { stroke-dashoffset: -17; } }

  /* ---------- nodes ---------- */
  .node {
    position: absolute; left: 0; top: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow);
    transform-origin: 50% 50%; will-change: transform;
    cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
    transition: border-color .25s, box-shadow .3s, opacity .4s;
    --mx: 50%; --my: 0%; --c: var(--accent);
  }
  .node > * { position: relative; z-index: 1; }
  .node::before {
    content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
    background: radial-gradient(220px circle at var(--mx) var(--my), var(--accent), transparent 70%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0; transition: opacity .3s; z-index: 2;
  }
  .node::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(320px circle at var(--mx) var(--my), rgba(139, 92, 246, .11), transparent 60%);
    opacity: 0; transition: opacity .3s; z-index: 0;
  }
  .node:hover::before, .node:hover::after, .node.is-dragging::before, .node.is-dragging::after { opacity: 1; }
  .node:hover { box-shadow: var(--shadow), 0 0 0 1px rgba(139, 92, 246, .22), 0 0 50px -10px var(--glow); }
  .node.is-selected { border-color: rgba(139, 92, 246, .7); box-shadow: var(--shadow), 0 0 0 3px rgba(139, 92, 246, .18), 0 0 50px -12px var(--glow); }
  .node:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 4px; }
  .node.is-dragging { cursor: grabbing; box-shadow: 0 34px 70px rgba(0, 0, 0, .5), 0 0 0 1px rgba(139, 92, 246, .35), 0 0 70px -10px var(--glow); }
  .node.spawn { opacity: 0; }
  .node-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font: 500 11px/1.2 var(--mono); color: var(--muted); letter-spacing: .02em; }
  .node-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .node-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node-tag { margin-inline-start: auto; padding: 3px 7px; border-radius: 99px; border: 1px solid var(--line); font-size: 10px; white-space: nowrap; }
  .node-b { padding: 14px; }
  .node-b > .fade { animation: rise .5s cubic-bezier(.2, .9, .3, 1.2) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .selbox { position: absolute; inset: -7px; border-radius: 20px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 3; }
  .selbox i { position: absolute; width: 7px; height: 7px; background: var(--panel-solid); border: 1.5px solid var(--accent); border-radius: 2px; }
  .selbox i:nth-child(1) { left: -3px; top: -3px; } .selbox i:nth-child(2) { right: -3px; top: -3px; }
  .selbox i:nth-child(3) { left: -3px; bottom: -3px; } .selbox i:nth-child(4) { right: -3px; bottom: -3px; }
  .node.is-selected .selbox { opacity: 1; }

  /* prompt node */
  .p-text { font-size: 14px; line-height: 1.55; margin: 0 0 12px; }
  .p-text::after { content: ""; display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -2px; margin-inline-start: 3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .p-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .p-tags span { font-size: 11px; padding: 4px 8px; border-radius: 99px; background: var(--card-2); border: 1px solid var(--line); color: var(--muted); }
  .p-meta { display: flex; justify-content: space-between; font: 500 11px var(--mono); color: var(--muted); }
  .p-meta b { color: var(--good); font-weight: 500; }

  /* mini UI pieces */
  .mini-nav { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
  .mini-nav .lg { width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .mini-nav .bar { height: 5px; width: 26px; border-radius: 3px; background: var(--card-3); }
  .mini-nav .pill { margin-inline-start: auto; height: 16px; width: 44px; border-radius: 99px; background: var(--card-3); }
  .hero { position: relative; overflow: hidden; border-radius: 12px; padding: 14px; background: var(--card-2); border: 1px solid var(--line); }
  .hero::before { content: ""; position: absolute; width: 180px; height: 180px; inset-inline-end: -60px; top: -70px; border-radius: 50%; background: radial-gradient(circle, rgba(139, 92, 246, .45), transparent 70%); pointer-events: none; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; padding: 4px 9px; border-radius: 99px; background: rgba(139, 92, 246, .14); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, .3); }
  :root[data-theme="light"] .eyebrow { color: #6d28d9; }
  .hero h3 { margin: 10px 0 6px; font-size: 21px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
  html[lang="fa"] .hero h3 { letter-spacing: 0; line-height: 1.4; }
  .hero p { margin: 0 0 14px; font-size: 12px; line-height: 1.5; color: var(--muted); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .b { border: 1px solid var(--line-2); background: var(--card-3); border-radius: 9px; padding: 7px 12px; font-size: 12px; font-weight: 600; transition: transform .15s, background .2s, box-shadow .2s; }
  .b:hover { background: var(--card-2); }
  .b:active { transform: scale(.95); }
  .b.pri { background: var(--accent); border-color: transparent; color: #fff; box-shadow: 0 6px 18px -6px var(--accent); }
  .b.pri:hover { filter: brightness(1.1); }
  .b.wide { width: 100%; padding: 9px 12px; }

  .plan { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; }
  .plan em { font-style: normal; font: 500 10px var(--mono); padding: 3px 7px; border-radius: 99px; background: rgba(34, 211, 238, .12); color: var(--accent-2); }
  .price { margin: 10px 0 14px; display: flex; align-items: baseline; gap: 4px; }
  .price b { font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
  .price span { color: var(--muted); font-size: 12px; }
  .feats { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 9px; font-size: 12.5px; }
  .feats li { display: flex; gap: 8px; align-items: center; }
  .feats svg { color: var(--good); width: 14px; height: 14px; }
  .b.is-on { background: var(--good); box-shadow: 0 6px 18px -6px var(--good); color: #052e1f; }

  .an-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .an-l { font-size: 11.5px; color: var(--muted); }
  .an-v { font-size: 23px; font-weight: 800; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .delta { font: 500 11px var(--mono); color: var(--good); background: rgba(52, 211, 153, .12); padding: 3px 7px; border-radius: 99px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 9px; background: var(--card-2); border: 1px solid var(--line); margin-top: 12px; }
  .seg button { border: 0; background: none; font-size: 11px; padding: 4px 9px; border-radius: 6px; color: var(--muted); transition: background .2s, color .2s; }
  .seg button[aria-pressed="true"] { background: var(--card-3); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .bars { display: flex; align-items: flex-end; gap: 7px; height: 92px; margin-top: 14px; padding-bottom: 2px; border-bottom: 1px dashed var(--line-2); }
  .bars i { flex: 1; border-radius: 5px 5px 2px 2px; background: linear-gradient(to top, rgba(139, 92, 246, .35), var(--accent)); transition: height .7s cubic-bezier(.34, 1.56, .64, 1), filter .2s; min-height: 4px; }
  .bars i:last-child { background: linear-gradient(to top, rgba(34, 211, 238, .35), var(--accent-2)); }
  .bars i:hover { filter: brightness(1.3); }

  .lg-t { font-size: 16px; font-weight: 700; margin: 2px 0 14px; }
  .fld { display: grid; gap: 5px; margin-bottom: 10px; font-size: 11px; color: var(--muted); }
  .fld input { width: 100%; border: 1px solid var(--line-2); background: var(--card-2); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; color: var(--text); outline: none; transition: border-color .2s, box-shadow .2s; user-select: text; }
  .fld input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, .2); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; margin: 4px 0 14px; }
  .sw { width: 34px; height: 20px; border-radius: 99px; border: 0; padding: 0; background: var(--card-3); position: relative; transition: background .25s; flex: none; }
  .sw::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .35s cubic-bezier(.34, 1.56, .64, 1); }
  .sw[aria-checked="true"] { background: var(--accent); }
  .sw[aria-checked="true"]::after { transform: translateX(14px); }
  html[dir="rtl"] .sw[aria-checked="true"]::after { transform: translateX(-14px); }

  .node.note { background: #fde68a; border-color: #f5d35b; color: #3b2f06; --c: #d97706; }
  .node.note .node-h { color: #7a5c0b; border-color: rgba(0,0,0,.08); }
  .node.note .node-tag { border-color: rgba(0,0,0,.12); }
  .note-t { font-size: 14px; line-height: 1.5; min-height: 44px; outline: none; cursor: text; user-select: text; -webkit-user-select: text; font-weight: 500; }
  .note-t:focus { box-shadow: 0 0 0 2px rgba(217, 119, 6, .35); border-radius: 6px; }

  /* skeleton */
  .sk { display: grid; gap: 9px; }
  .sk i { display: block; height: 10px; border-radius: 6px; background: linear-gradient(90deg, var(--card-2) 0%, var(--card-3) 40%, var(--card-2) 80%); background-size: 220% 100%; animation: shimmer 1.2s linear infinite; }
  .sk i.h { height: 18px; width: 70%; } .sk i.s { width: 55%; } .sk i.blk { height: 70px; }
  @keyframes shimmer { to { background-position: -220% 0; } }
  .node.is-loading { border-color: rgba(139, 92, 246, .5); }

  /* generated templates */
  .steps { display: flex; gap: 5px; margin-bottom: 12px; }
  .steps i { height: 4px; flex: 1; border-radius: 3px; background: var(--card-3); }
  .steps i.on { background: var(--accent); }
  .small { font: 500 10.5px var(--mono); color: var(--muted); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 12px 0 14px; }
  .opt { border: 1px solid var(--line-2); background: var(--card-2); border-radius: 9px; padding: 9px; font-size: 12px; text-align: start; transition: border-color .2s, background .2s, transform .15s; }
  .opt:active { transform: scale(.96); }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: rgba(139, 92, 246, .14); }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .set-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .set-row small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .tile { border-radius: 10px; padding: 10px; background: var(--card-2); border: 1px solid var(--line); font-size: 12px; font-weight: 600; transition: transform .25s cubic-bezier(.34, 1.56, .64, 1), border-color .2s; }
  .tile:hover { transform: translateY(-2px); border-color: var(--line-2); }
  .tile span { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; margin-bottom: 8px; background: rgba(139, 92, 246, .16); color: #c4b5fd; }
  .tile span svg { width: 13px; height: 13px; }
  .quote { font-size: 13.5px; line-height: 1.6; margin: 0 0 14px; }
  .who { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .who i { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #f472b6, var(--accent)); }
  .who small { display: block; color: var(--muted); }
  .stars { color: #fbbf24; letter-spacing: 2px; font-size: 12px; margin-bottom: 8px; }
  .gen-h { font-size: 15px; font-weight: 700; margin: 0; }

  /* ---------- chrome ---------- */
  .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .topbar { position: fixed; top: 12px; inset-inline: 12px; display: flex; justify-content: space-between; gap: 10px; pointer-events: none; z-index: 20; }
  .topbar > * { pointer-events: auto; }
  .tb-group { display: flex; align-items: center; gap: 4px; padding: 5px; min-width: 0; }
  .brand { display: flex; align-items: center; gap: 8px; padding-inline: 6px 4px; font-weight: 700; font-size: 14px; letter-spacing: -.01em; white-space: nowrap; }
  .logo { width: 24px; height: 24px; border-radius: 7px; background: conic-gradient(from 210deg, var(--accent), var(--accent-2), #f472b6, var(--accent)); display: grid; place-items: center; }
  .logo::after { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--bg); }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; min-width: 0; }
  .crumb b { color: var(--text); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
  .sep { width: 1px; height: 18px; background: var(--line-2); margin-inline: 6px; flex: none; }
  .ib { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; border: 0; background: none; color: var(--muted); transition: background .2s, color .2s, transform .15s; flex: none; }
  .ib:hover { background: var(--card-3); color: var(--text); }
  .ib:active { transform: scale(.92); }
  .ib[aria-pressed="true"] { background: rgba(139, 92, 246, .18); color: #c4b5fd; }
  :root[data-theme="light"] .ib[aria-pressed="true"] { color: #6d28d9; }
  .avatars { display: flex; padding-inline: 4px 6px; }
  .avatars i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--panel-solid); margin-inline-start: -7px; display: grid; place-items: center; font: 600 10px var(--font); font-style: normal; color: #fff; }
  .avatars i:first-child { margin-inline-start: 0; }
  .share { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9px; border: 0; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600; transition: transform .15s, opacity .2s; }
  .share:active { transform: scale(.95); }
  .share.done { background: var(--good); color: #052e1f; }
  .theme-ico .moon { display: none; }
  :root[data-theme="light"] .theme-ico .sun { display: none; }
  :root[data-theme="light"] .theme-ico .moon { display: block; }

  .menu-wrap { position: relative; }
  .menu { position: absolute; top: calc(100% + 10px); inset-inline-start: 0; min-width: 210px; padding: 6px; margin: 0; list-style: none; display: none; z-index: 30; transform-origin: top; }
  html[dir="ltr"] .menu { transform-origin: top left; } html[dir="rtl"] .menu { transform-origin: top right; }
  .menu.open { display: block; animation: pop .22s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(-4px); } }
  .menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; font-size: 13px; text-align: start; }
  .menu button:hover, .menu button:focus-visible { background: var(--card-3); outline: none; }
  .menu kbd { margin-inline-start: auto; font: 500 10.5px var(--mono); color: var(--muted); }

  .rail { position: fixed; top: 50%; transform: translateY(-50%); inset-inline-start: 12px; display: flex; flex-direction: column; gap: 2px; padding: 5px; z-index: 20; }
  .rail .sep { width: 18px; height: 1px; margin: 4px auto; }

  .composer { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 420px)); z-index: 20; display: grid; gap: 8px; }
  .chips { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 99px; padding: 6px 11px; font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; transition: color .2s, border-color .2s, transform .2s cubic-bezier(.34, 1.56, .64, 1); }
  .chip:hover { color: var(--text); border-color: var(--line-2); transform: translateY(-2px); }
  .chip svg { width: 12px; height: 12px; color: var(--accent); }
  .cform { display: flex; align-items: center; gap: 8px; padding: 7px; padding-inline-start: 14px; position: relative; }

    testimonial: (t) => `<div class="fade"><div class="stars" aria-hidden="true">★★★★★</div><p class="quote">${esc(t.q)}</p><div class="who"><i aria-hidden="true"></i><span>${esc(t.name)}<small>${esc(t.role)}</small></span></div></div>`
  };
  const TYPE_COLORS = { onboarding: '#8b5cf6', settings: '#22d3ee', features: '#f472b6', testimonial: '#fbbf24' };
  const TYPE_ORDER = ['onboarding', 'settings', 'features', 'testimonial'];
  function wireGenerated(n) {
    n.el.querySelectorAll('.sw').forEach((sw) => sw.addEventListener('click', () => sw.setAttribute('aria-checked', String(sw.getAttribute('aria-checked') !== 'true'))));
    const opts = n.el.querySelectorAll('.opt');
    opts.forEach((o) => o.addEventListener('click', () => opts.forEach((p) => p.setAttribute('aria-pressed', String(p === o)))));
  }
  function detectType(text) {
    const s = text.toLowerCase();
    if (/setting|toggle|preference|تنظیم|کلید/.test(s)) return 'settings';
    if (/feature|grid|tile|ویژگی|امکانات/.test(s)) return 'features';
    if (/testimon|quote|review|نظر|بازخورد/.test(s)) return 'testimonial';
    if (/onboard|step|welcome|signup|آشنایی|مرحله|خوش/.test(s)) return 'onboarding';
    return TYPE_ORDER[gid % TYPE_ORDER.length];
  }
  function overlaps(x, y, w, h, skip) {
    for (const n of nodes.values()) {
      if (n === skip) continue;
      if (x < n.tx + n.w + 28 && x + w + 28 > n.tx && y < n.ty + n.h + 28 && y + h + 28 > n.ty) return true;
    }
    return false;
  }
  function spawnPos(w, h, parent) {
    let x, y;
    if (isPhone()) { x = parent.tx + (parent.w - w) / 2; y = parent.ty + parent.h + 70; }
    else { x = RTL ? parent.tx - 130 - w : parent.tx + parent.w + 130; y = parent.ty; }
    for (let i = 0; i < 60 && overlaps(x, y, w, h); i++) y += 50;
    return { x, y };
  }
  function ensureVisible(n, h) {
    const R = region();
    const sx = view.tx * 0 + view.x, z = view.z;
    const left = n.tx * z + sx, top = n.ty * z + view.y, right = left + n.w * z, bottom = top + (h || n.h) * z;
    if (left >= R.l && right <= R.l + R.w && top >= R.t && bottom <= R.t + R.h) return;
    const cx = n.tx + n.w / 2, cy = n.ty + (h || n.h) / 2;
    setView(R.l + R.w / 2 - cx * z, R.t + R.h / 2 - cy * z, z, true);
  }

  /* ---------- prompt → UI ---------- */
  const form = $('cform'), input = $('prompt'), go = $('go'), statusEl = $('status'), statusText = $('statusText');
  let busy = false;
  function setStatus(text, state) { statusText.textContent = text; statusEl.className = 'status' + (state ? ' ' + state : ''); }
  const wait = (ms) => new Promise((r) => setTimeout(r, RM ? Math.min(ms, 250) : ms));
  async function generate(text, typeHint) {
    if (busy) return;
    busy = true;
    const type = typeHint || detectType(text);
    gid++;
    const parent = (selected && nodes.has(selected.id)) ? selected : nodes.get('prompt') || [...nodes.values()][0];
    const w = 270, estH = 250;
    const pos = parent ? spawnPos(w, estH, parent) : { x: 0, y: 0 };
    const n = makeNode({ id: 'g' + gid, w, x: pos.x, y: pos.y, color: TYPE_COLORS[type], cls: 'is-loading spawn',
      label: `${T.types[type]} · ${text.length > 34 ? text.slice(0, 32) + '…' : text}`, tag: T.generatedTag,
      html: '<div class="sk" aria-hidden="true"><i class="h"></i><i></i><i class="s"></i><i class="blk"></i><i></i></div>' });
    n.el.setAttribute('aria-busy', 'true');
    n.el.style.zIndex = ++zTop;
    if (!RM) { n.s = 0.7; n.vs = 0; n.rest = false; }
    requestAnimationFrame(() => n.el.classList.remove('spawn'));
    const edge = parent ? addEdge(parent.id, n.id, true) : null;
    ensureVisible(n, estH);
    form.classList.add('busy'); go.classList.add('busy'); go.disabled = true; $('goLabel').textContent = T.generating;
    kick();
    for (const s of T.steps) { setStatus(s, 'work'); await wait(650); }
    if (nodes.has(n.id)) {
      n.body.innerHTML = TPL[type](T.tpl[type]);
      n.el.classList.remove('is-loading');
      n.el.removeAttribute('aria-busy');
      wireGenerated(n);
      if (!RM) { n.s = 0.94; n.vs = 1.2; n.rest = false; }
      if (edge) edge.g.classList.remove('pending');
      select(n);
      kick();
    }
    setStatus(T.done, 'ok');
    form.classList.remove('busy'); go.classList.remove('busy'); go.disabled = false; $('goLabel').textContent = T.generate;
    input.value = '';
    busy = false;
    setTimeout(() => { if (!busy) setStatus(T.idle); }, 2600);
  }
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim() || T.chips[gid % T.chips.length][1];
    generate(text);
  });
  $('chips').addEventListener('click', (e) => {
    const c = e.target.closest('.chip'); if (!c) return;
    input.value = c.textContent.trim();
    generate(input.value, c.dataset.type);
  });

  /* ---------- tools ---------- */
  let tool = 'select', spaceDown = false;
  function setTool(t) {
    tool = t;
    document.querySelectorAll('[data-tool]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === t)));
    canvas.classList.toggle('tool-hand', t === 'hand');
    canvas.classList.toggle('tool-note', t === 'note');
  }
  document.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
  let noteCount = 0;
  function dropNote(wx, wy) {
    noteCount++;
    const n = makeNode({ id: 'n' + noteCount + '-' + Date.now(), w: 190, x: wx - 95, y: wy - 30, cls: 'note spawn', label: T.note.label, tag: '✎',
      html: `<div class="note-t" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="${esc(T.note.label)}">${esc(T.note.fresh)}</div>` });
    n.el.style.zIndex = ++zTop;
    if (!RM) { n.s = 0.6; n.rest = false; }
    requestAnimationFrame(() => n.el.classList.remove('spawn'));
    select(n); kick();
    setTool('select');
    const t = n.el.querySelector('.note-t');
    setTimeout(() => { t.focus(); const r = document.createRange(); r.selectNodeContents(t); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }, 30);
  }

  /* ---------- pointer: drag / pan / pinch ---------- */
  const pointers = new Map();
  let gesture = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (e.button === 2) return;
    const nodeEl = e.target.closest('.node');
    const interactive = e.target.closest('button, input, a, [contenteditable="true"]');
    if (nodeEl && interactive && tool === 'select' && !spaceDown) { select(nodes.get(nodeEl.dataset.id)); return; }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* noop */ }
    if (pointers.size === 2) {
      if (gesture && gesture.type === 'drag') endDrag();
      const [p, q] = [...pointers.values()];
      gesture = { type: 'pinch', d0: Math.hypot(p.x - q.x, p.y - q.y) || 1, z0: view.z, mx: (p.x + q.x) / 2, my: (p.y + q.y) / 2, vx: view.x, vy: view.y };
      return;
    }
    if (pointers.size > 2) return;
    if (tool === 'note' && !nodeEl) { const w = toWorld(e.clientX, e.clientY); dropNote(w.x, w.y); pointers.delete(e.pointerId); return; }
    if (nodeEl && tool === 'select' && !spaceDown && e.button === 0) {
      const n = nodes.get(nodeEl.dataset.id); if (!n) return;
      select(n);
      const w = toWorld(e.clientX, e.clientY);
      gesture = { type: 'drag', n, ox: w.x - n.tx, oy: w.y - n.ty, id: e.pointerId };
      n.dragging = true; n.ts = 1.035; n.rest = false;
      n.el.classList.add('is-dragging');
      kick();
    } else {
      if (!nodeEl) select(null);
      gesture = { type: 'pan', sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
      view.anim = false;
      canvas.classList.add('is-panning');
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gesture) return;
    if (gesture.type === 'drag' && e.pointerId === gesture.id) {
      const w = toWorld(e.clientX, e.clientY);
      const n = gesture.n;
      n.tx = w.x - gesture.ox; n.ty = w.y - gesture.oy; n.rest = false;
      kick();
    } else if (gesture.type === 'pan') {
      const x = gesture.vx + e.clientX - gesture.sx, y = gesture.vy + e.clientY - gesture.sy;
      view.x = view.tx = x; view.y = view.ty = y; applyView(); kick();
    } else if (gesture.type === 'pinch' && pointers.size >= 2) {
      const [p, q] = [...pointers.values()];
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      const z = clamp(gesture.z0 * d / gesture.d0, ZOOM_MIN, ZOOM_MAX);
      const wx = (gesture.mx - gesture.vx) / gesture.z0, wy = (gesture.my - gesture.vy) / gesture.z0;
      view.z = view.tz = z; view.x = view.tx = mx - wx * z; view.y = view.ty = my - wy * z; view.anim = false;
      applyView(); kick();
    }
  });
  function endDrag() {
    if (!gesture || gesture.type !== 'drag') return;
    const n = gesture.n;
    n.dragging = false; n.ts = 1; n.rest = false;
    n.el.classList.remove('is-dragging');
    kick();
  }
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (gesture && gesture.type === 'drag') endDrag();
    if (pointers.size === 0) { gesture = null; canvas.classList.remove('is-panning'); }
    else if (gesture && gesture.type === 'pinch') {
      const [p] = [...pointers.values()];
      gesture = { type: 'pan', sx: p.x, sy: p.y, vx: view.x, vy: view.y };
    }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', (e) => {
    if (e.target.closest('input, [contenteditable="true"]') && !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
      zoomAt(e.clientX, e.clientY, view.z * Math.exp(-dy * 0.0075), false);
    } else {
      const f = e.deltaMode === 1 ? 16 : 1;
      const dx = e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX, dy = e.shiftKey && !e.deltaX ? 0 : e.deltaY;
      view.anim = false;
      view.x = view.tx = view.x - dx * f; view.y = view.ty = view.y - dy * f; applyView(); kick();
    }
  }, { passive: false });

  /* ---------- zoom controls ---------- */
  const center = () => { const R = region(); return [R.l + R.w / 2, R.t + R.h / 2]; };
  $('zIn').addEventListener('click', () => { const [cx, cy] = center(); zoomAt(cx, cy, (view.anim ? view.tz : view.z) * 1.25, true); });
  $('zOut').addEventListener('click', () => { const [cx, cy] = center(); zoomAt(cx, cy, (view.anim ? view.tz : view.z) / 1.25, true); });
  $('zLabel').addEventListener('click', () => { const [cx, cy] = center(); zoomAt(cx, cy, 1, true); });
  $('zFit').addEventListener('click', () => fit(true));

  /* ---------- minimap ---------- */
  const mmBtn = $('minimap'), mm = $('mm'), mmc = mm.getContext ? mm.getContext('2d') : null;
  let mmMap = null;
  function drawMinimap() {
    mmDirty = false;
    if (!mmc || getComputedStyle(mmBtn).display === 'none') return;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const W = mmBtn.clientWidth, H = mmBtn.clientHeight;
    if (mm.width !== W * dpr) { mm.width = W * dpr; mm.height = H * dpr; }
    const cs = getComputedStyle(document.documentElement);
    const b = bounds();
    const vx1 = -view.x / view.z, vy1 = -view.y / view.z, vw = innerWidth / view.z, vh = innerHeight / view.z;
    const x1 = Math.min(b.x, vx1) - 40, y1 = Math.min(b.y, vy1) - 40;
    const x2 = Math.max(b.x + b.w, vx1 + vw) + 40, y2 = Math.max(b.y + b.h, vy1 + vh) + 40;
    const s = Math.min((W - 16) / (x2 - x1), (H - 16) / (y2 - y1));
    const ox = (W - (x2 - x1) * s) / 2 - x1 * s, oy = (H - (y2 - y1) * s) / 2 - y1 * s;
    mmMap = { s, ox, oy };
    mmc.setTransform(dpr, 0, 0, dpr, 0, 0);
    mmc.clearRect(0, 0, W, H);
    for (const n of nodes.values()) {
      mmc.fillStyle = n === selected ? cs.getPropertyValue('--accent').trim() : cs.getPropertyValue('--line-2').trim();
      if (n.el.classList.contains('note')) mmc.fillStyle = '#fde68a';
      mmc.beginPath();
      if (mmc.roundRect) mmc.roundRect(n.x * s + ox, n.y * s + oy, n.w * s, n.h * s, 2); else mmc.rect(n.x * s + ox, n.y * s + oy, n.w * s, n.h * s);
      mmc.fill();
    }
    mmc.strokeStyle = cs.getPropertyValue('--accent-2').trim();
    mmc.lineWidth = 1.2;
    mmc.strokeRect(vx1 * s + ox, vy1 * s + oy, vw * s, vh * s);
  }
  mmBtn.addEventListener('click', (e) => {
    if (!mmMap) return;
    const r = mmBtn.getBoundingClientRect();
    const wx = (e.clientX - r.left - mmMap.ox) / mmMap.s, wy = (e.clientY - r.top - mmMap.oy) / mmMap.s;
    if (!e.clientX && !e.clientY) { fit(true); return; }
    setView(innerWidth / 2 - wx * view.z, innerHeight / 2 - wy * view.z, view.z, true);
  });

  /* ---------- menu, theme, share, dialog ---------- */
  const menuBtn = $('menuBtn'), menu = $('menu');
  function openMenu(open) {
    menu.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
    if (open) { const f = menu.querySelector('button'); if (f) f.focus(); }
  }
  menuBtn.addEventListener('click', () => openMenu(!menu.classList.contains('open')));
  document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.menu-wrap')) openMenu(false); });
  menu.addEventListener('keydown', (e) => {
    const items = [...menu.querySelectorAll('button')], i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    if (e.key === 'Escape') { openMenu(false); menuBtn.focus(); }
  });
  let showGrid = true;
  function toggleGrid() { showGrid = !showGrid; canvas.classList.toggle('no-grid', !showGrid); $('gridLabel').textContent = showGrid ? T.mGridHide : T.mGridShow; }
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    openMenu(false);
    if (a === 'fit') fit(true);
    if (a === 'grid') toggleGrid();
    if (a === 'reset') { build(); fit(true); toast(T.resetDone); }
    if (a === 'keys') openKeys();
  });
  const dlg = $('keys');
  function openKeys() { if (dlg.showModal && !dlg.open) dlg.showModal(); }
  $('themeBtn').addEventListener('click', () => {
    const d = document.documentElement;
    d.dataset.theme = d.dataset.theme === 'light' ? 'dark' : 'light';
    mmDirty = true; kick();
  });
  let toastT = 0;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }
  $('shareBtn').addEventListener('click', () => {
    const b = $('shareBtn');
    try { if (navigator.clipboard) navigator.clipboard.writeText(location.href).catch(() => {}); } catch (_) { /* noop */ }
    b.classList.add('done'); toast(T.shared);
    setTimeout(() => b.classList.remove('done'), 1400);
  });

  /* ---------- keyboard ---------- */
  const editing = (el) => el && (el.tagName === 'INPUT' || el.isContentEditable);
  document.addEventListener('keydown', (e) => {
    if (editing(e.target)) { if (e.key === 'Escape') e.target.blur(); return; }
    if (dlg.open) return;
    const k = e.key;
    if (k === ' ' && !e.repeat && e.target.tagName !== 'BUTTON') { spaceDown = true; canvas.classList.add('space'); e.preventDefault(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (k === 'v' || k === 'V') setTool('select');
    else if (k === 'h' || k === 'H') setTool('hand');
    else if (k === 'n' || k === 'N') setTool('note');
    else if (k === 'g' || k === 'G') toggleGrid();
    else if (k === '?') openKeys();
    else if (k === '!' || (e.shiftKey && e.code === 'Digit1')) fit(true);
    else if (k === '+' || k === '=') $('zIn').click();
    else if (k === '-' || k === '_') $('zOut').click();
    else if (k === '0') $('zLabel').click();
    else if (k === 'Escape') { select(null); openMenu(false); }
    else if ((k === 'Delete' || k === 'Backspace') && selected) { e.preventDefault(); const n = selected; removeNode(n); canvas.focus(); }
    else if (selected && k.startsWith('Arrow')) {
      e.preventDefault();
      const st = e.shiftKey ? 50 : 10;
      if (k === 'ArrowLeft') selected.tx -= st;
      if (k === 'ArrowRight') selected.tx += st;
      if (k === 'ArrowUp') selected.ty -= st;
      if (k === 'ArrowDown') selected.ty += st;
      selected.rest = false; kick();
    }
  });
  document.addEventListener('keyup', (e) => { if (e.key === ' ') { spaceDown = false; canvas.classList.remove('space'); } });

  /* ---------- init ---------- */
  build();
  fit(false);
  setStatus(T.idle);
  let rT = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rT);
    rT = setTimeout(() => {
      const mode = isPhone() ? 'phone' : 'desk';
      if (mode !== layoutMode) { layout(false); }
      fit(false);
    }, 120);
  });
  // fonts change card heights → re-layout the phone column once they land
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
    for (const n of nodes.values()) { n.w = n.el.offsetWidth; n.h = n.el.offsetHeight; }
    if (![...nodes.values()].some((n) => !n.initial)) { layout(false); fit(false); }
  });
  // entrance: cards spring in with a light stagger
  if (!RM) {
    [...nodes.values()].forEach((n, i) => {
      n.el.classList.add('spawn');
      n.s = 0.86; n.y += 30; render(n);
      setTimeout(() => { n.el.classList.remove('spawn'); n.rest = false; kick(); }, 60 + i * 50);
    });
  }
})();
</script>
</body>
</html>
