name: nabuxui

services:
  app:
    build:
      context: .
      dockerfile: playground/Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    init: true

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: nabuxui
      MYSQL_USER: nabuxui
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
